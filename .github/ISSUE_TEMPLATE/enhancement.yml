name: "작업 / 개선"
description: "기능 추가, 구조 변경, 성능이나 편의성 개선. 고장난 것이 아니라 의도적으로 바꾸려는 것."
title: "enhancement: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        버그는 **무엇을 봤는지** 적지만 작업은 **무엇을 왜 바꾸려는지** 적습니다.
        끝나는 조건을 정하지 않은 작업은 끝나지 않습니다.

  - type: dropdown
    id: scale
    attributes:
      label: "규모"
      description: "버그의 심각도와 라벨 값은 같지만 묻는 것이 다르다. 얼마나 나쁜가가 아니라 얼마나 큰가. major=핵심 기능 추가, 아키텍처 변경, 성능 대폭 개선 / minor=부가 기능, UI 개선, 편의성 / trivial=문서, 스타일"
      options:
        - major
        - minor
        - trivial
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "영역"
      options:
        - db
        - backend
        - frontend
        - security
        - etc
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "착수 버전"
      description: "이 작업을 시작하는 시점의 버전."
      placeholder: "BE 3.16.1.1"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: "현재 상태"
      description: "지금 어떻게 돌아가는지 사실만. 불만이 아니라 동작을 적는다."
      placeholder: "수집기 12개가 각자 다른 재시도 정책을 갖고 있다. 3개는 재시도가 없다."
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: "바꾼 뒤 상태"
      description: "무엇이 달라지는지. 수단이 아니라 결과로 적는다."
      placeholder: "모든 수집기가 같은 백오프 정책을 쓰고, 실패는 한 곳에서 집계된다."
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: "왜 지금인가"
      description: "지금 하지 않으면 무엇이 문제인지. 이 칸을 못 채우면 착수하지 말고 백로그에 둔다."
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: "완료 조건"
      description: "전부 만족하면 닫는다. 남이 확인할 수 있는 문장으로 적는다. 개선했다 같은 문장은 조건이 아니다."
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: "하지 않을 것"
      description: "이번 범위에서 빼는 것. 비워 두면 범위가 번진다."
      placeholder: "수집기 인터페이스 자체는 건드리지 않는다. 신규 수집기 추가도 이번 범위가 아니다."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        아래는 이슈를 닫을 때 채웁니다. 등록 시점에는 비워 둡니다.

  - type: textarea
    id: result
    attributes:
      label: "결과"
      description: "무엇을 했나. 완료 조건과 어긋난 것이 있으면 그것도 적는다."
    validations:
      required: false

  - type: input
    id: done-version
    attributes:
      label: "반영 버전"
      placeholder: "BE 3.16.2.0 (커밋: abc1234)"
    validations:
      required: false
