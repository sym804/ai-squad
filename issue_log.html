    --muted: hsl(230 8% 68%);
    --border: hsl(230 14% 28%);
    --hover: hsl(230 16% 23%);
    --primary: hsl(234 89% 74%);
    --primary-soft: hsl(244 47% 26%);
    --primary-fg: hsl(240 25% 12%);
    --open: hsl(142 60% 58%);
    --done: hsl(262 70% 76%);

    --warn-bg: hsl(38 80% 16%); --warn-fg: hsl(38 92% 72%);

  --bg: hsl(230 18% 15%);
  --fg: hsl(230 10% 87%);
  --surface: hsl(230 16% 18%);
  --surface-2: hsl(230 16% 22%);
  --muted: hsl(230 8% 68%);
  --border: hsl(230 14% 28%);
  --hover: hsl(230 16% 23%);
  --primary: hsl(234 89% 74%);
  --primary-soft: hsl(244 47% 26%);
  --primary-fg: hsl(240 25% 12%);
  --open: hsl(142 60% 58%);
  --done: hsl(262 70% 76%);
  --ok-bg: hsl(142 60% 16%);  --ok-fg: hsl(142 70% 72%);
  --warn-bg: hsl(38 80% 16%); --warn-fg: hsl(38 92% 72%);
  --bad-bg: hsl(0 70% 18%);   --bad-fg: hsl(0 84% 78%);

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12.5px; }

.top {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.top-inner, .wrap, .foot {
  max-width: 1180px;
  margin: 0 auto;
  padding-left: 24px;
  padding-right: 24px;
}
.top-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-top: 18px;
  padding-bottom: 18px;
}
.top h1 { margin: 0; font: 700 22px/1.3 var(--display); letter-spacing: -.01em; }
.meta { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.meta a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
}
.icon-btn:hover { background: var(--hover); }
.icon-btn svg { width: 18px; height: 18px; }

.tabs {
  display: flex;
  gap: 4px;
  margin: 20px 0 0;
  border-bottom: 1px solid var(--border);
}
.tab {
  border: 0;
  background: none;
  padding: 8px 12px 10px;
  margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  cursor: pointer;
  font-weight: 600;
}
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--primary); }
.tab .n { font-weight: 500; margin-left: 4px; color: var(--muted); }

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin: 16px 0 12px;
}
.seg {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  padding: 3px;
}
.seg button {
  border: 0;
  background: none;
  padding: 6px 12px;
  border-radius: 7px;
  cursor: pointer;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-fg); }
.seg .n { font-weight: 500; opacity: .8; margin-left: 4px; font-variant-numeric: tabular-nums; }
.search {
  flex: 1 1 260px;
  min-width: 0;
  position: relative;
}
.search input {
  width: 100%;
  height: 38px;
  padding: 0 40px 0 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}
.search kbd {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  font: 11px var(--mono);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 0 5px;
}
select {
  height: 38px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}

.filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 18px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.fgroup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fgroup > span { color: var(--muted); font-size: 12px; margin-right: 2px; }
.chip {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 12.5px;
  cursor: pointer;
  white-space: nowrap;
}
.chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--fg);
  font-weight: 600;
}
.chip .n { color: var(--muted); margin-left: 3px; font-variant-numeric: tabular-nums; }
.chip:disabled { opacity: .45; cursor: default; }
.reset {
  margin-left: auto;
  border: 0;
  background: none;
  color: var(--primary);
  cursor: pointer;
  font-size: 13px;
}
.reset[hidden] { display: none; }

.count { margin: 14px 2px 8px; color: var(--muted); font-size: 13px; }

.list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.row {
  display: grid;
  grid-template-columns: 22px 92px minmax(0, 1fr) auto;
  gap: 4px 12px;
  align-items: start;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  cursor: pointer;
}
.row:first-child { border-top: 0; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--primary-soft); }
.st { width: 18px; height: 18px; margin-top: 2px; }
.st.open { color: var(--open); }
.st.done { color: var(--done); }
.num { color: var(--muted); padding-top: 1px; white-space: nowrap; }
.title-btn {
  display: block;
  border: 0;
  background: none;
  padding: 0;
  text-align: left;
  font-weight: 600;
  font-size: 14.5px;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.sub {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
  color: var(--muted);
  font-size: 12.5px;
}
.sub .dot { opacity: .5; }
.key { white-space: nowrap; padding-top: 1px; }

.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 6px;
  padding: 0 7px;
  font-size: 12px;
  font-weight: 600;
  line-height: 20px;
  white-space: nowrap;
}
.b-neutral { background: var(--neutral-bg); color: var(--neutral-fg); }
.b-bad { background: var(--bad-bg); color: var(--bad-fg); }
.b-warn { background: var(--warn-bg); color: var(--warn-fg); }
.b-info { background: var(--info-bg); color: var(--info-fg); }
.b-ok { background: var(--ok-bg); color: var(--ok-fg); }
.b-open { background: var(--ok-bg); color: var(--ok-fg); }
.b-done { background: var(--neutral-bg); color: var(--done); }
.b-outline { border: 1px solid var(--border); color: var(--muted); font-weight: 500; }

.empty { padding: 48px 16px; text-align: center; color: var(--muted); }
.empty button { margin-top: 10px; }
.btn {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
.btn:hover { background: var(--hover); }

.scrim {
  position: fixed; inset: 0;
  background: var(--scrim);
  z-index: 10;
}
.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(720px, 100%);
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow);
  z-index: 11;
  display: flex;
  flex-direction: column;
}
[hidden] { display: none !important; }
.d-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.d-head .grow { flex: 1; }
.d-nav { display: flex; gap: 6px; }
.d-body { overflow: auto; padding: 20px 24px 40px; }
.d-body h2 { margin: 0 0 10px; font: 700 21px/1.4 var(--display); overflow-wrap: anywhere; }
.d-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px 16px;
  padding: 12px 14px;
  background: var(--surface-2);
  border-radius: 10px;
  margin-bottom: 22px;
}
.facts div > span { display: block; color: var(--muted); font-size: 12px; }
.facts div > b { font-weight: 600; overflow-wrap: anywhere; }
.block-title {
  margin: 26px 0 4px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .04em;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
}
.field { margin-top: 14px; }
.field h3 { margin: 0 0 4px; font-size: 13.5px; }
.text { overflow-wrap: anywhere; }
.text p { margin: 0 0 6px; }
.text ul, .text ol { margin: 0 0 6px; padding-left: 20px; }
.text li { margin: 2px 0; }
.text li.task { list-style: none; margin-left: -18px; }
.text li.task input { margin: 0 6px 0 0; vertical-align: -2px; }
.text code {
  font: 12.5px var(--mono);
  background: var(--surface-2);
  border-radius: 4px;
  padding: 1px 4px;
}
.text pre {
  font: 12px/1.5 var(--mono);
  background: var(--surface-2);
  border-radius: 8px;
  padding: 10px 12px;
  overflow: auto;
  margin: 4px 0 8px;
}
.text pre code { background: none; padding: 0; }

.held-wrap {
  margin-top: 16px;
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.held-note { color: var(--muted); font-size: 13px; margin: 16px 2px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td {
  text-align: left;
  vertical-align: top;
  padding: 8px 12px;
  border-top: 1px solid var(--border);
}
th { border-top: 0; background: var(--surface-2); white-space: nowrap; font-weight: 600; }

.foot {
  padding-top: 28px;
  padding-bottom: 36px;
  color: var(--muted);
  font-size: 12.5px;
}

@media (max-width: 720px) {
  .top-inner, .wrap, .foot { padding-left: 16px; padding-right: 16px; }
  .row { grid-template-columns: 20px minmax(0, 1fr); padding: 12px; }
  .row .num { grid-column: 2; grid-row: 1; }
  .row .main { grid-column: 2; }
  .row .key { grid-column: 2; }
  .st { grid-row: 1 / span 2; }
  .d-body { padding: 16px 16px 32px; }
  .seg { width: 100%; }
  .seg button { flex: 1; padding: 6px 8px; }
  .reset { margin-left: 0; }
}
</style>

d","제목":"Slack 첨부 이미지 분석 지원 (Claude/Gemini Vision)","재현 절차 / 완료 조건":"Slack 메시지에 첨부된 이미지(image/* MIME)를 봇 토큰으로 다운로드해 base64 인코딩 후, Claude(Anthropic SDK), Gemini(google-genai SDK) Vision 호출에 전달. Codex는 멀티모달 미지원이라 prompt 끝에 \"이미지 N장 첨부됨\" 노트만 추가. Debate / Coding / Bridge 3개 모드 모두 적용. 부팅 시 비전 SDK·키 헬스체크 추가.","원인 및 수정 / 결과":"기존 봇 파이프라인이 event[\"text\"]만 추출하고 event[\"files\"]를 무시했고, 모든 ask 시그니처가 prompt: str 단일이었음. 사용자가 차트 이미지를 첨부해도 분석 불가, 일부 에이전트(Gemini)는 검색 결과로 환각 분석을 하는 사고가 발생. agents/base.py·claude.py·gemini.py·codex.py 시그니처 확장 + slack_files.py 신규 + 모드별 호출 사이트 업데이트로 해결.","영향 범위":"backend (slack_bot.py, agents/*, modes/*, slack_files.py 신규). anthropic, google-genai 의존성 추가.","발생 버전":"v0.5.1","수정 버전":"v0.6.0","상태":"완료","트래커":79,"비고":"Major"},{"이슈번호":80,"발견일":"2026-05-08","유형":"bug","심각도":"Major","영역":"backend","제목":"이미지 첨부 분석을 SDK 직호출로 잘못 구현 → CLI prompt 첨부로 정정","사전 조건":"사용자가 Claude Code / Codex CLI / Gemini CLI 를 OAuth 구독 모드(API 키 없음)로 운영 중. Google AI Pro 구독, Anthropic/OpenAI 구독 OAuth 로그인 상태.","재현 절차 / 완료 조건":"슬랙 채널에 차트 이미지 첨부 후 봇에 분석 요청 → 봇이 \"anthropic SDK 미설치\" 또는 \"ANTHROPIC_API_KEY 환경변수 없음\" 에러 반환. v0.6.0 도입 직후 이미지 첨부 분석 자체가 동작 불가 상태.","원인 및 수정 / 결과":"v0.6.0 에서 비전 호출을 Anthropic Python SDK + google-genai SDK 직호출로 구현했는데, 이는 사용자 운영 모델과 불일치(API 키 강요). CLI 자체가 OAuth 로 multimodal 입력을 처리할 수 있는데 그 경로를 무시함. 정정: Slack 첨부 이미지를 임시 파일로 저장 + 절대경로를 각 CLI 의 첨부 syntax 로 prompt 에 끼워 호출 (Claude: prompt 안에 경로 + Read 도구, Gemini: @\u003cpath>, Codex: prompt 안에 경로 + read 도구). SDK 의존성(anthropic, google-genai) 제거, 비전 헬스체크 제거. 임시 디렉토리는 작업 종료 후 shutil.rmtree 로 정리.","영향 범위":"backend (agents/claude.py, agents/gemini.py, agents/codex.py, slack_files.py, slack_bot.py, requirements.txt). 신규 단위 테스트 142건 통과 (이전 139건 대비 +3).","발생 버전":"v0.6.0","수정 버전":"v0.6.1","상태":"완료","트래커":80,"비고":"Major"},{"이슈번호":81,"발견일":"2026-05-08","유형":"bug","심각도":"Critical","영역":"backend","제목":"텍스트+이미지 한 번에 입력 시 봇 무반응","사전 조건":"없음","재현 절차 / 완료 조건":"1) Slack 채널에 텍스트와 이미지를 한 메시지로 첨부 후 전송 2) 봇 무반응","원인 및 수정 / 결과":"slack_bot.hand 에 도달하지 못하는 토론","재현 절차 / 완료 조건":"1. 토론 시작\n2. 2명만 agree=true, 1명 지속 불일치(교착)\n3. _is_stalemate가 메시지 앞 100자 문자열 set 비교라 거의 매칭 안 됨\n4. MAX_DEBATE_ROUNDS(10)까지 불필요하게 진행","원인 및 수정 / 결과":"원인: 앞 100자 일치 휴리스틱은 매 라운드 도입부가 달라 overlap>=2가 사실상 불가. 수정: 라운드별 {agrees,diverged} 스냅샷 기반 재설계(최근 2라운드 정체+발산 시 교착), 시그니처 history->round_history 변경","영향 범위":"DebateMode.start/followup 종료 판정, 토론 비용/지연","발생 버전":"v0.6.4","수정 버전":"v0.7.0","상태":"완료","트래커":87,"비고":"Major"},{"이슈번호":88,"발견일":"2026-05-19","유형":"bug","심각도":"Major","영역":"backend","제목":"백업 풀 비대칭 + 이중 장애 시 에이전트 다양성 붕괴 및 동일 인스턴스 중복","사전 조건":"Codex/Gemini 순차 또는 동시 장애(타임아웃/429)","재현 절차 / 완료 조건":"1. Codex 장애 -> Claude-B 교체\n2. Gemini 장애 -> Claude-B 교체\n3. 살아있는 에이전트가 Claude/Claude-B/Claude-B 동일 모델 3중 -> 교차검증 무의미\n4. 동적 선택이 이미 live인 백업 인스턴스 재선택 시 동일 객체 중복","원인 및 수정 / 결과":"원인: 정적 매핑이 Codex/Gemini 모두 Claude-B로 수렴, Gemini 계열 백업 부재. 수정: GeminiBackupAgent 신설 + base_family 속성 + 실패/생존 계열 회피 동적 선택, 이미 live인 인스턴스는 후보 제외(없으면 풀 폴백)","영향 범위":"agents 백업 교체 로직, 교차검증 다양성","발생 버전":"v0.6.4","수정 버전":"v0.7.0","상태":"완료","트래커":88,"비고":"Major"},{"이슈번호":89,"발견일":"2026-05-19","유형":"bug","심각도":"Major","영역":"backend","제목":"_parse_consensus JSON 파싱 실패 시 무음 None 반환으로 합의 누락","사전 조건":"에이전트가 CONSENSUS JSON을 trailing comma/콤마 누락 등 미세 깨진 형태로 출력","재현 절차 / 완료 조건":"1. 응답 말미 CONSENSUS JSON에 trailing comma 등 경미한 오류\n2. json.loads 실패\n3. 조용히 None 반환 -> 해당 라운드 합의 미집계\n4. 토론 불필요 연장 또는 통합문 부실","원인 및 수정 / 결과":"원인: 단일 json.loads 후 except에서 무음 None(로깅/복구 없음). 수정: salvage 단계화(trailing comma 제거 재시도 -> agree/summary 정규식 추출) + 실패 시 WARNING 로깅","영향 범위":"DebateMode 합의 집계/종료 판정","발생 버전":"v0.6.4","수정 버전":"v0.7.0","상태":"완료","트래커":89,"비고":"Major"},{"이슈번호":90,"발견일":"2026-05-19","유형":"bug","심각도":"Minor","영역":"backend","제목":"최종 통합문을 self.agents[0] 단독 생성하여 교체된 백업 모델로 편향","사전 조건":"agents[0](Claude)이 장애로 백업 교체된 상태에서 합의 종료","재현 절차 / 완료 조건":"1. Claude 장애 -> 백업 교체\n2. 합의 도달\n3. 통합문 생성이 self.agents[0](교체된 백업) 단독 -> 해당 모델 편향","원인 및 수정 / 결과":"원인: 고정 인덱스 0번 사용. 수정: _select_final_answer_agent()로 교체 안 된 원본 우선 선택, "이슈번호":94,"발견일":"2026-05-20","유형":"enhancement","심각도":"major","영역":"backend","제목":"Antigravity CLI(agy) 마이그레이션 준비: GEMINI_CLI_BINARY 환경변수 토글","재현 절차 / 완료 조건":"GEMINI_CLI_BINARY 환경변수(기본 gemini, 허용 gemini/agy, 그 외는 gemini로 폴백) 도입. agents/gemini.py 에 _build_subprocess_args 헬퍼 추가: gemini=['gemini','-m',model,'-y','-p',''] + stdin pipe / agy=['agy','--dangerously-skip-permissions','-p',prompt] + stdin DEVNULL. _available_models()는 agy일 때 placeholder만 반환, _mark_failed()는 no-op. _run_cli/_run_progress_once 가 헬퍼+조건부 DEVNULL 사용. 기본값 gemini 유지로 즉시 배포해도 기존 동작 100% 보존","원인 및 수정 / 결과":"2026-05-19 Google I/O 2026에서 Gemini CLI 종료 + Antigravity CLI 통합 공식 발표(Google Developers Blog). 2026-06-18부터 Google AI Pro/Ultra/무료 사용자 Gemini CLI 요청 차단. 사전에 코드 경로를 분기 가능하도록 준비해 D-day 직전 긴급 배포 위험 회피, 6/18까지 dry-run/실측 시간 확보","영향 범위":"agents/gemini.py, config.py, tests/test_gemini.py 및 토론/코딩/브릿지 모드의 Gemini 호출 경로 (런타임 동작은 환경변수 미설정 시 기존과 동일)","발생 버전":"v0.7.1","수정 버전":"v0.7.2","상태":"완료","트래커":96,"비고":"Major"},{"이슈번호":95,"발견일":"2026-05-20","유형":"bug","심각도":"Major","영역":"backend","제목":"agy 호출이 cmd /c 로 감싸져 prompt 메타문자가 셸 파싱됨 + argv 길이 한계 미가드","사전 조건":"GEMINI_CLI_BINARY=agy 환경에서만 발현. 기본값 gemini 사용 시 영향 없음","재현 절차 / 완료 조건":"1. GEMINI_CLI_BINARY=agy 토글\n2. Slack 에 prompt 가 & | ^ % \u003c > 같은 메타문자 포함 메시지 전송 (예: \"검색: foo & bar | grep\")\n3. cmd.exe 가 & 를 명령 구분자로 해석해 agy 인자가 깨짐 / 또는 코딩 모드에서 Claude 응답+코드가 길어져 32KB CommandLine 한계 초과 시 CreateProcess 실패","원인 및 수정 / 결과":"원인: process.py 의 platform_cmd 가 모든 명령을 cmd /c 로 감싸서 native .exe 인 agy 도 셸 파싱 거치고, agy 의 prompt 는 argv 직접 전달이라 32KB 한계 영향. 수정: (1) process.py 에 _NATIVE_EXE_NAMES 화이트리스트 + _resolve_native_exe 헬퍼 추가, agy 는 cmd /c 우회하고 절대경로로 직접 실행. (2) agents/gemini.py 에 _AGY_PROMPT_ARGV_LIMIT=25000 + _truncate_for_agy_argv 헬퍼 추가, 초과 시 머리만 사용 + [...truncated] 표식. (3) _build_cmd 가 agy 경로 빈 prompt 에 ValueError raise. (4) 테스트 absent env vs empty value 분리 + 미사용 변수 제거","영향 범위":"agents/gemini.py, process.py, tests/test_process.py, tests/test_gemini.py (Windows agy 경로만 영향. gemini 경로 동작 불변)","발생 버전":"v0.7.2","수정 버전":"v0.7.2.1","상태":"완료","트래커":97,"비고":"Major"},{"이슈번호":96,"발견일":"2026-05-20","유형":"bug","심각도":"major","영역":"backend","제목":"2-vs-1 deadlock 토론이 MAX 라운드까지 끌림 (agrees\u003c2 라 _is_stalemate 미발동)","사전 조건":"3 에이전트 중 1명이 출처 없이 이견 지속 + 나머지 2명이 (서로 합의했음에도) agree=false 마킹","재현 절차 / 완료 조건":"1. DEBATE 채널에서 \"런던고라니 옛날 정치-경제 분리 발언 찾을 수 있나\" 등 출처 추적이 안되는 질문\n2. R1~R5 진행: Claude+Codex 가 \"출처 URL 없는 인용은 환각 위험\" 입장 합의, Gemini 가 매 R 마다 약간 다른 인용 변형 제시\n3. 기존 종료 조건: agrees>=3(전원 합의) 또는 agrees>=2 + _is_stalemate(2R 발산 지속). 모두 agrees 카운트가 발목\n4. 결국 no_progress(전원 자기 반복 Jaccard>=0.6) 가 R5 에 가까스로 발동 또는 MAX_DEBATE_ROUNDS(10) 도달","원인 및 수정 / 결과":"원인: (1) SYSTEM_PROMPT 의 agree=true 정의가 전원 일치 묵시(\"다른 에이전트들과 의견이 충분히 일치\")라 Claude/Codex 가 Gemini 와 일치 안 하니 agree=false 마킹. (2) 페어 합의 + outlier 패턴을 명시 감지하는 로직 없음. 수정: (A) SYSTEM_PROMPT 완화 \"최소 1명의 다른 에이전트와 충분히 일치\". (B) _pair_outlier 헬퍼 신설(페어와이즈 Jaccard, best>=0.30 + outlier 페어들 \u003c=60%면 outlier 이름 반환), _persistent_outlier 헬퍼(같은 outlier 2R 연속이면 종료 신호), start/followup 양 루프에 \"다수 합의 (2/3, {outlier} 이견 지속)\" 분기 추가. agree 카운트 무관하게 안전망","영향 범위":"DebateMode start/followup 종료 로직, 모든 토론 채널의 비용/속도 (페어 outlier 케이스에서 R3 종료)","발생 버전":"v0.7.2.1","수정 버전":"v0.7.3","상태":"완료","트래커":98,"비고":"Major"},{"이슈번호":97,"발견일":"2026-05-20","유형":"bug","심각도":"major","영역":"backend","제목":"Gemini Semaphore 이벤트 루프 바인딩 회귀로 토론 33분 hang + 응답 손실","사전 조건":"Slack Bolt 가 토론마다 새 이벤트 루프 컨텍스트에서 핸들러 호출","재현 절차 / 완료 조건":"1. 봇 재시작 후 슬랙 채널에 토론 발신\n2. 첫 토론 R1 또는 R2 에서 Gemini 응답 손실 (\"Semaphore object at 0x... is bound to a different event loop\" 에러 또는 작업 중 N초 표시 후 무응답)\n3. 백업 Claude-B 정상 투입되어 토론은 진행되나 1라운드 Gemini 데이터 손실\n4. 일부 케이스(thread 1779275130 등산vs헬스): Semaphore acquire 단계 hang → _run_progress_once 의 overall_timeout(t*2=360s) 검사가 while loop 안에 있어 진입 못 함 → 33분(2019초) 진행 표시만 계속, 종료 메시지 없이 영구 멈춤","원인 및 수정 / 결과":"원인: (1) 모듈 전역 _gemini_concurrency = asyncio.Semaphore(3) 가 첫 사용 이벤트 루프에 바인딩되는 Python asyncio 한계. Slack Bolt 의 새 이벤트 루프에서 acquire 시 \"bound to different loop\" 에러. (2) Semaphore acquire 단계에서 block 되면 _run_progress_once 의 while True 내부 overall_timeout 검사가 발동 못 함. 수정: (A) WeakKeyDictionary 기반 per-loop lazy init 으로 _get_gemini_concurrency() 헬퍼 신설, 호출 사이트 2개 갱신. (B) ask_with_progress 의 _run_progress_once 호출을 asyncio.wait_for(timeout=t*2.5) 외부 가드로 래핑, 내부 timeout 우회되어도 강제 cancel + 프로세스 정리. 신규 단위 5건 추가, 전체 250 passed","영향 범위":"agents/gemini.py 의 모든 Gemini 호출 경로 (토론/코딩/브릿지 모드 전부)","발생 버전":"v0.7.3","수정 버전":"v0.7.3.2","상태":"완료","트래커":99,"비고":"Major"},{"이슈번호":98,"발견일":"2026-05-20","유형":"bug","심각도":"critical","영역":"backend","제목":"v0.7.3.2 핫픽스 누락: _run_progress_once L293 _gemini_concurrency 잔존 + cancel cleanup 부재","사전 조건":"v0.7.3.2 배포 후 봇 재시작 직후","재현 절차 / 완료 조건":"1. v0.7.3.2 봇 재시작\n2. 첫 Gemini 호출(ask_with_progress 경로) 시 _run_progress_once L293 에서 NameError: _gemini_concurrency 미정의\n3. 모든 토론/코딩 모드 Gemini 진행성 호출 즉시 실패\n4. 추가: 외부 wait_for cancel 발생 시 spawn 직후~register 이전 cancel window 에 좀비 프로세스 leak","원인 및 수정 / 결과":"원인: v0.7.3.2 의 replace_all=true 가 들여쓰기 차이로 _run_cli L220 만 잡고 _run_progress_once L275(현 L293) 는 놓침. Codex 교차검증 (1) Block 발견. 추가: 두 함수 모두 subprocess lifecycle 에 try/finally cleanup 없어 외부 cancel 시 좀비. 수정: (A) L293 _gemini_concurrency → _get_gemini_concurrency() 교체. (B) _run_cli proc.communicate 호출을 try/except BaseException 으로 감싸 cancel 시 kill_process_tree + 짧은 wait. (C) _run_progress_once 의 spawn 이후 전체 lifecycle 을 try/finally 로 감싸고 finally 에 proc.returncode is None 검사 후 kill_process_tree + wait_for(2s). 전체 비-라이브 250 passed 회귀 없음","영향 범위":"agents/gemini.py 의 모든 Gemini 호출 경로 (NameError 로 진행성 호출 100% 실패)","발생 버전":"v0.7.3.2","수정 버전":"v0.7.3.3","상태":"완료","트래커":"SYM-11","비고":"Block"},{"이슈번호":99,"발견일":"2026-05-26","유형":"enhancement","심각도":"minor","영역":"backend","제목":"PDF 첨부 지원 추가 (이미지에 더해 PDF 도 각 CLI read 도구로 처리) + images → attachments 전체 리네이밍","재현 절차 / 완료 조건":"slack_files.extract_images 가 image/* MIME 만 다운로드, PDF 던지면 봇이 무시. application/pdf 추가 + kind 필드 + size 분기 (이미지 5MB / PDF 20MB). 각 에이전트 prompt augment 함수가 kind 분기된 안내 생성 (Claude Read native PDF / Gemini @path / Codex read 텍스트 추출). Python pymupdf 등 PDF 파싱 의존성 추가 없음 (글로벌 CPU 과열 룰 정합). 부수: extract_images → extract_attachments, _augment_with_image_paths/note → _augment_with_attachments, images 인자/변수 → attachments 전체 통일, BridgeMode._call_claude_vision → _call_claude_with_attachments.","원인 및 수정 / 결과":"사용자가 KB 보험제안서 PDF 같은 일반 문서를 슬랙 봇에 던지면 분석/요약 받기를 원하는데, 기존 이미지 전용 흐름이라 PDF 가 무시되던 문제. 모든 CLI 의 read 도구가 PDF 를 native 처리하므로 MIME 필터만 풀어주면 거의 자동 동작. 변수명/함수명도 의미상 attachments 가 정확.","영향 범위":"slack_files.py + 각 에이전트 (claude/codex/gemini) + backup 3 + modes/{bridge,coding,debate} + slack_bot.py + 테스트 5건. 슬랙 PDF 첨부 흐름 전반.","발생 버전":"v0.7.3.3","수정 버전":"v0.7.4","상태":"완료","트래커":100,"비고":"Minor"},{"이슈번호":100,"발견일":"2026-05-26","유형":"bug","심각도":"Major","영역":"backend","제목":"v0.7.4 PDF 첨부 실전 회귀: Gemini workspace 격리 + Codex read 도구 PDF 미지원","사전 조건":"v0.7.4 배포 직후 실제 슬랙 스레드(1779791375.628899) 에서 PDF 첨부 테스트","재현 절차 / 완료 조건":"1. Slack #ai-debate 채널에 PDF 첨부 + 평가 요청 메시지\n2. Gemini: Error executing tool read_file: Path not in workspace 에러로 PDF 자체 못 읽음\n3. Codex: pdftotext 미설치 → pypdf import 시도 → 일부 페이지만 추출 후 부분 답변\n4. Claude 만 정상 분석 완료","원인 및 수정 / 결과":"원인: (1) Gemini CLI 의 read_file 도구가 임시 디렉토리(AppData/Local/Temp/slack_attachments_*) 를 workspace 외부로 판단하고 거부. (2) Codex CLI 의 read 도구가 PDF native 미지원. 수정: (A) slack_bot.py 의 tmp_dir 을 \u003cproject>/.tmp/ 내부로 변경 (Gemini workspace 회피). (B) slack_files.py 에 extract_pdf_text + format_pdf_text_inline 헬퍼 추가, PDF 다운로드 직후 pypdf 로 텍스트 추출 → 반환 dict 의 text 필드. (C) 각 에이전트 _augment_with_attachments 가 PDF text 를 prompt 에 인라인 블록으로 첨부. Codex instruction 에 pdftotext 시도 금지 명시. (D) requirements.txt 에 pypdf>=4.0 추가. (E) .gitignore 에 .tmp/ 추가.","영향 범위":"slack_bot.py + slack_files.py + agents/{claude,codex,gemini}.py + 테스트 2건. 슬랙 PDF 첨부 시 Gemini/Codex 모두 실패하던 흐름 복구.","발생 버전":"v0.7.4","수정 버전":"v0.7.5","상태":"완료","트래커":101,"비고":"Major"},{"이슈번호":101,"발견일":"2026-05-26","유형":"bug","심각도":"Critical","영역":"backend","제목":"v0.7.5 자체 회귀: slack_bot.py 의 os import 누락으로 PDF/이미지 첨부 시 _runner NameError 무응답","사전 조건":"v0.7.5 (a37ae5f) 배포 직후 실전 PDF 첨부 테스트 (슬랙 스레드 1779797934.173099)","재현 절차 / 완료 조건":"1. v0.7.5 봇 재시작 후 슬랙 채널에 PDF 첨부 + 평가 요청 메시지\n2. 봇 완전 무응답 (Round 1/2/3 진행 표시조차 없음)\n3. bot_output.log 확인: Exception in thread Thread-10 (_runner): NameError: name 'os' is not defined (slack_bot.py:173)\n4. 첨부 없는 일반 텍스트 메시지는 정상 동작 (라우팅이 _runner 진입 전 분기)","원인 및 수정 / 결과":"원인: v0.7.5 에서 tmp_dir 을 \u003cproject>/.tmp/ 내부로 옮길 때 _runner 안에서 os.path.join / os.makedirs 를 추가했는데 모듈 전역에 import os 가 없음. 함수 내부 import tempfile, shutil 만 추가하고 os 는 빠뜨림. 수정: (A) slack_bot.py 모듈 전역 import 에 os 추가. (B) tests/test_slack_bot.py 에 test_os_module_imported 회귀 테스트 추가 (모듈에 os attribute 존재 + 진짜 os 모듈인지 검증).","영향 범위":"slack_bot.py + tests/test_slack_bot.py. v0.7.5 commit 부터 v0.7.6 fix 까지 약 30분간 모든 첨부 메시지 봇 무응답.","발생 버전":"v0.7.5","수정 버전":"v0.7.6","상태":"완료","트래커":102,"비고":"Critical"},{"이슈번호":102,"발견일":"2026-05-29","유형":"bug","심각도":"Major","영역":"backend","제목":"토론 합의된 답변이 모델 답변 대신 'API Error: 500 Internal server error' 에러 문구로 방송됨","사전 조건":"통합문 생성 에이전트(원본 Claude)가 합의문 생성 시점에 Anthropic API 5xx(500/529 등)를 맞는 경우 (슬랙 스레드 1780056574.625539)","재현 절차 / 완료 조건":"1. stockradar 채널에 사실형 질문 토론 요청 (예: '1990년부터 삼성전자 시총 코스피 비중')\n2. 라운드 1~3 정상 진행, 전원 요약까지 정상\n3. 마지막 '💡 합의된 답변:' 자리에 'API Error: 500 Internal server error. This is a server-side issue...' 가 그대로 출력됨","원인 및 수정 / 결과":"원인: 합의문은 _generate_final_answer() 가 agent.ask() 로 생성. Claude Code CLI 는 API 5xx 시 예외를 던지지 않고 --output-format json 의 result 필드에 'API Error: 500 ...' 문구를 담아 정상 종료 → (1) agents/base.py _is_fatal_error 가 429/quota 만 알고 5xx/overloaded 패턴이 없어 has_error=False, (2) _generate_final_answer 의 try/except 는 파이썬 예외만 잡아 문자열 에러를 통과시켜 그대로 broadcast. 수정: (A) agents/base.py _FATAL_SUBSTRINGS 에 'internal server error','overloaded_error' 추가 + _FATAL_REGEX 에 5xx alternative (error|status|code 앵커 뒤 5xx, API Error/APIError/statusCode/HTTP/1.1 포맷 포함, 500자/약 500조/목표가 529,000원/handler.py:500 오탐 없음). (B) modes/debate.py _generate_final_answer 를 후보 순회+1회 재시도+_is_bad_final_answer 검사+_deterministic_merge 폴백으로 재작성하여 에러 문자열이 절대 합의문으로 방송되지 않도록 함. 회귀 테스트 추가(test_agent_base.py, test_consensus.py). Codex 교차검증 후 268 passed.","영향 범위":"modes/debate.py 토론 종료 합의문 + agents/base.py fatal error 감지(라운드 중 5xx 백업 교체 포함). 사용자에게 에러 문구가 최종 답변으로 노출됨.","발생 버전":"v0.7.6","수정 버전":"v0.7.7","상태":"완료","트래커":103,"비고":"Major"},{"이슈번호":103,"발견일":"2026-05-29","유형":"bug","심각도":"Minor","영역":"backend","제목":"Gemini 매 발언 첫 줄에 'True color (24-bit) support not detected' 터미널 경고 누출","사전 조건":"non-TTY 환경에서 Gemini CLI 호출 시 (자체 테스트 thread 1780059304.126349)","재현 절차 / 완료 조건":"1. stockradar 채널에서 토론 실행\n2. Gemini 발언마다 첫 줄에 'Warning: True color (24-bit) support not detected. Using a terminal with true color enabled will result in a better visual experience.' 가 본문 앞에 노출됨","원인 및 수정 / 결과":"원인: agents/gemini.py 의 _clean_output 노이즈 필터가 _NOISE_KEYWORDS 의 키워드 포함 라인을 제거하는데, 색상 경고로 '256-color support not detected' 만 등록돼 있어 실제 출력되는 'True color (24-bit) support not detected' 변종이 필터를 통과해 응답에 섞임. 수정: _NOISE_KEYWORDS 의 '256-color support not detected' 를 공통 꼬리 'support not detected' 로 교체하여 256-color/True color(24-bit) 및 향후 변종을 모두 필터. tests/test_gemini.py::TestCleanOutput 에 true-color 케이스 회귀 테스트 추가. 단위 269 passed, 실제 Gemini 호출 + 슬랙 전수 스캔 확인, Codex 교차검증 통과. 추가: 자체 테스트가 합의문만 검사해 이 노이즈를 놓쳤던 문제도 전수 스캔 방식으로 개선.","영향 범위":"Gemini 에이전트 Slack 답변 외관. 기능 오류는 아니나 매 발언에 경고 노이즈 노출.","발생 버전":"v0.7.7","수정 버전":"v0.7.8","상태":"완료","트래커":104,"비고":"Minor"},{"이슈번호":104,"발견일":"2026-06-08","유형":"bug","심각도":"Major","영역":"backend","제목":"토론 결론의 \"미해결 쟁점\"이 각 에이전트 요약/합의된 답변과 중복 (disagreements 필드 미사용 dead data)","사전 조건":"토론이 발산(diverged) 상태로 종료될 때","재현 절차 / 완료 조건":"1. 토론 채널에 의견이 갈릴 주제 입력\n2. 결론 메시지에서 \"📋 각 에이전트 요약\"과 \"⚠️ 미해결 쟁점\"이 같은 summary 를 나열\n3. \"💡 합의된 답변\"과도 유사한 내용이 반복 노출됨","원인 및 수정 / 결과":"원인: CONSENSUS JSON 에 실제 대립점용 disagreements([{agent,point,why}]) 전용 필드가 있고 시스템 프롬프트가 채우라 지시하나, 코드가 한 번도 읽지 않는 dead data 였음. _summaries_diverge() 가 issue_note 를 disagreements 가 아니라 각 에이전트 summary[:120] 로 생성 → 결론의 \"각 에이전트 요약\"(summary 전체) 및 \"합의된 답변\"과 중복. 다음 라운드 프롬프트 주입에도 같은 노트가 쓰여 수렴 유도 약화. 수정: _format_issue_note() 헬퍼 신설로 disagreements 의 point/why 만으로 노트 생성(\"{name}: {point} ({why})\"), 구조적 대립점이 없으면 빈 문자열 반환해 \"미해결 쟁점\" 줄 자체 생략(표시+주입 3곳 모두 if issue_note 가드). 발산 감지(Jaccard)·교전강제 로직은 불변. 단위 테스트 294 passed + 슬랙 E2E 3종 중복 0건 + Codex 정적 교차검증 통과.","영향 범위":"modes/debate.py 토론 결론 메시지 표시 + 다음 라운드 프롬프트 주입","발생 버전":"v0.7.8","수정 버전":"v0.7.9","상태":"완료","트래커":105,"비고":"Major"},{"이슈번호":105,"발견일":"2026-06-09","유형":"enhancement","심각도":"major","영역":"backend","제목":"agy `-p` stdout 미출력 버그(#76) 우회 - 디스크 transcript 에서 trace 토큰으로 응답 복구","재현 절차 / 완료 조건":"agy(Antigravity CLI) 백엔드(GEMINI_CLI_BINARY=agy)에서 `-p`가 non-TTY 에 stdout 응답을 안 쓰는 upstream 버그(#76)를 우회. 호출별 고유 trace 토큰(AGYTRACE+uuid)을 prompt 끝에 심고(argv 절단 이후 append 로 유실 방지), 디스크 transcript (brain/\u003ccid>/.system_generated/logs/transcript.jsonl)의 USER_INPUT 에서 그 토큰이 박힌 턴의 최종 PLANNER_RESPONSE 만 회수. _recover_agy_response/_extract_traced_response/_iter_turns/_trace_in 신설, _run_cli·_run_progress_once 통합. cwd→cid 매핑 1차 + since_ts 이후 transcript 스캔 2차(둘 다 토큰 매칭). cid UUID 검증·content 정규화·마커 strip 포함.","원인 및 수정 / 결과":"Gemini CLI 개인 티어가 2026-06-18 종료 예정인데, 후계 agy 는 #76(2026-06-09 OPEN, 1.0.6 미수정)으로 비대화형 stdout 이 비어 봇 백엔드로 못 썼다. 응답이 디스크엔 정상 저장되는 점을 이용해 복구 경로를 붙여 agy 를 실사용 가능 상태로 준비. trace 토큰 방식이라 동시 호출/대화 재사용/공통 prompt prefix 에도 다른 호출 응답을 오회수하지 않음. Codex 3차 교차검증 통과 + 라이브 실측 3회(stdin=DEVNULL 에서 agy 1.0.6 EXIT=0/STDOUT_LEN=0 인데 토큰 복구로 정확 회수).","영향 범위":"agents/gemini.py (GEMINI_CLI_BINARY=agy 경로). gemini 기본 경로는 토큰 무시로 무영향.","발생 버전":"v0.7.9","수정 버전":"v0.7.10","상태":"완료","트래커":106,"비고":"Major"},{"이슈번호":106,"발견일":"2026-06-10","유형":"bug","심각도":"minor","영역":"backend","제목":"Windows 슬랙 문의 시 cmd 콘솔 창 깜빡임 (claude 호출의 전역 MCP context7 spawn)","사전 조건":"사용자 전역 Claude 설정에 stdio 방식 MCP(context7 = npx -y @upstash/context7-mcp) 등록 + Windows 환경","재현 절차 / 완료 조건":"슬랙에서 봇에 문의 → 에이전트 '생각 중' 진입 시점에 cmd/conhost 콘솔 창이 잠깐 떴다 사라짐. claude 에이전트가 호출될 때마다 재현(가끔처럼 보이나 claude 경로면 상시).","원인 및 수정 / 결과":"원인: 봇이 `cmd /c claude -p ...` 로 Claude Code CLI 호출 시, claude 가 부팅하며 전역 MCP context7 을 `cmd /c npx ...` 로 새로 spawn. claude.exe 가 CREATE_NO_WINDOW(숨김 콘솔)로 떠 있어 이 손자 프로세스가 부모 숨김 콘솔을 못 물려받고 새 conhost 콘솔을 할당 → 깜빡임. 수정: claude 호출부(agents/claude.py _build_cmd/_build_stream_cmd, modes/bridge.py _call_claude)에 `--strict-mcp-config` 추가 → 전역 MCP 0개 로드(context7 spawn 제거). 라이브 격리 비교(있음 spawn=False / 없음 spawn=True) + Codex 교차검증 통과.","영향 범위":"agents/claude.py, modes/bridge.py. Windows 에서 claude 에이전트가 타는 모든 경로(토론/브릿지/첨부 분석). codex(MCP url= HTTP 원격)·gemini 무관.","발생 버전":"v0.7.10","수정 버전":"v0.7.11","상태":"완료","트래커":107,"비고":"Minor"},{"이슈번호":107,"발견일":"2026-06-11","유형":"enhancement","심각도":"major","영역":"backend","제목":"리서치 모드 신설 (#ai-리서치, 3 AI 분담형 팬아웃 조사+교차검증+출처 리포트)","재현 절차 / 완료 조건":"#ai-리서치 채널 질문 → 분해(claude, 하위질문 JSON) → 하위질문 라운드로빈 분담 조사(claude/codex/gemini 병렬, 웹) → 생산자!=검증자 교차검증(supported/disputed/unverified) → claude 종합 → Slack 스레드 전송. modes/research.py 신설(순수 엔진 함수 + ResearchMode), config(RESEARCH_CHANNEL_ID/RESEARCH_SUBQ_MAX)·slack_bot 라우팅. 견고성: 분해 실패 단일질문 degrade, asyncio.gather(return_exceptions=True), _ask_named 백업 인계, disputed/unverified 드롭 없이 리포트 표기.","원인 및 수정 / 결과":"기능 확장 방향으로 토론 고도화+리서치를 원했고 둘이 같은 '근거 기반 협업 코어'(웹 근거·상호 교차검증·출처)를 공유 → 엔진 한 번 구현해 두 모드로 노출(Phase 1=리서치, Phase 2=토론 고도화). 실사용 가치(출처 달린 신뢰 리포트) + 토론 고도화 토대 확보.","영향 범위":"modes/research.py(신규), config.py, slack_bot.py, README/.env.example. 신규 #ai-리서치 채널. 기존 토론/코딩/브릿지 모드 무영향.","발생 버전":"v0.7.11","수정 버전":"v0.8.0","상태":"완료","트래커":108,"비고":"Major"},{"이슈번호":108,"발견일":"2026-06-11","유형":"bug","심각도":"minor","영역":"backend","제목":"리서치 최종 종합 답변이 채널에 안 보이고 스레드에만 남음","사전 조건":"리서치 모드(#ai-리서치) 사용 + 결과를 채널 타임라인에서 확인하려는 경우","재현 절차 / 완료 조건":"1. #ai-리서치 에 질문 전송\n2. 리서치 완료 후 종합 답변이 스레드 안에만 게시되고 채널 타임라인엔 표시 안 됨","원인 및 수정 / 결과":"원인: ResearchMode 가 종합 답변/리포트를 _post_long(스레드 전용)으로만 전송. 수정: debate 처럼 _broadcast_long(첫 청크 reply_broadcast=True)로 종합 답변을 채널에도 노출, 상세 출처/쟁점 리포트는 스레드 유지. 회귀 테스트 추가(26건), 라이브 확인.","영향 범위":"modes/research.py (리서치 모드 결과 전송)","발생 버전":"v0.8.0","수정 버전":"v0.8.1","상태":"완료","트래커":109,"비고":"Minor"},{"이슈번호":109,"발견일":"2026-06-11","유형":"bug","심각도":"minor","영역":"backend","제목":"Windows에서 봇 작업 시 cmd 콘솔 창 깜빡임 (agy statusline)","사전 조건":"GEMINI_CLI_BINARY=agy + agy 전역 설정 statusLine.enabled=true + Windows","재현 절차 / 완료 조건":"1. 봇이 agy 호출하는 작업(리서치/토론) 실행\n2. 진행 중 cmd/sh 콘솔 창이 주기적으로 떴다 사라짐","원인 및 수정 / 결과":"원인: agy 가 statusLine 명령을 주기적으로 셸(cmd /c·sh -c)로 실행 → 그 셸 콘솔이 깜빡임. 세션 격리(S4U)는 상시 로그인 시 같은 세션이라 무효, statusLine 명령 변경도 agy 가 항상 셸 래핑이라 무효. 최종: agy 전역 설정 statusLine.enabled=false 로 비활성(사용자 선택). 부수로 봇을 S4U 비대화형 예약작업으로 전환(로그아웃 복원력) + watchdog DETACHED/BREAKAWAY 기동 + CREATE_NO_WINDOW 보강. 격리 실측으로 새 agy statusline 0건 확인. (v0.7.11 claude context7 와 별개 원인)","영향 범위":"watchdog_guard.py, watchdog.py, migrate_session0.ps1, agy 전역 settings.json(레포 외). agy 쓰는 전 모드(토론/코딩/리서치)","발생 버전":"v0.7.11","수정 버전":"v0.8.1","상태":"완료","트래커":110,"비고":"Minor"},{"이슈번호":110,"발견일":"2026-06-11","유형":"enhancement","심각도":"minor","영역":"backend","제목":"agy 자동 업데이트 비활성화로 봇 가동 중 안정성 확보","재현 절차 / 완료 조건":"GEMINI_CLI_BINARY=agy 일 때 config.make_filtered_env() 가 자식 프로세스 env 에 AGY_CLI_DISABLE_AUTO_UPDATE=1 을 주입","원인 및 수정 / 결과":"agy 는 호출 시 백그라운드 업데이터로 자기 실행 파일을 자동 교체(update_status.json 에 \"Update successful, restart CLI to use\" 실제 이력). 봇 가동 중 교체되면 진행 중 호출이 깨질 수 있어 자동 업데이트를 차단(버전 고정·안정성). 깜빡임 방지가 아니라 안정성 목적.","영향 범위":"agy 사용 시 모든 에이전트 호출(config.make_filtered_env)","발생 버전":"v0.8.1","수정 버전":"v0.8.2","상태":"완료","트래커":111,"비고":"Minor"},{"이슈번호":111,"발견일":"2026-06-11","유형":"bug","심각도":"trivial","영역":"etc","제목":"리서치 모드에서 agy 자동 업데이터(agy --version) 콘솔 창 깜빡임","사전 조건":"GEMINI_CLI_BINARY=agy + 봇이 대화형 세션(로그인 상태)에서 가동","재현 절차 / 완료 조건":"1. #ai-리서치 채널에 질문 전송\n2. agy 가 병렬 호출될 때마다 cmd 콘솔 창이 잠깐 떴다가 사라짐(깜빡임)","원인 및 수정 / 결과":"원인: agy 가 호출마다 백그라운드 업데이터(agy --bg-updater → agy --version)를 띄우고, 그 버전체크 콘솔 창이 대화형 데스크톱에 수십 ms 노출됨(봇이 못 막는 detached 손자). 리서치는 agy 6+개 병렬 호출이라 두드러짐. 억제 시도 전부 실측 무효: AGY_CLI_DISABLE_AUTO_UPDATE(버전체크 창 잔존)/last_check 미래화/S4U 세션격리(로그인 중 동일 세션)/부모 CREATE_NO_WINDOW/숨김 데스크톱 lpDesktop/agy CLI 플래그(없음). 처분: 알려진 agy 한계로 수용·문서화(기능 영향 없음). v0.7.11 claude context7, v0.8.1 agy statusline 과는 별개 제3원인.","영향 범위":"agy 사용 시 모든 에이전트 호출(리서치 모드 병렬에서 부각), Windows 대화형 세션","발생 버전":"v0.8.0","수정 버전":"v0.8.2(수용)","상태":"완료","트래커":112,"비고":"Trivial"},{"이슈번호":112,"발견일":"2026-06-11","유형":"enhancement","심각도":"minor","영역":"frontend","제목":"리서치 리포트 출처를 Slack 하이퍼링크로 축약(긴 URL 숨김)","재현 절차 / 완료 조건":"출처 블록을 \"도메인: 전체URL\" → Slack \"\u003curl|짧은라벨>\" 형식으로 변경. 라벨=도메인+짧고 의미있는 경로 끝(percent-encoding 디코딩), 경로 없음/28자초과/무의미하면 도메인만. 신규 _short_source_label() (modes/research.py).","원인 및 수정 / 결과":"#ai-리서치 실사용 스레드에서 출처 URL이 너무 길게 표시됨(특히 Gemini 웹 그라운딩 redirect 토큰 200자+). 긴 URL을 링크 뒤로 숨겨 가독성 개선, 같은 도메인 다중 출처는 경로 끝으로 구분.","영향 범위":"리서치 모드 출처 표시(modes/research.py _format_report)","발생 버전":"v0.8.2","수정 버전":"v0.8.3","상태":"완료","트래커":113,"비고":"Minor"},{"이슈번호":113,"발견일":"2026-06-11","유형":"enhancement","심각도":"minor","영역":"frontend","제목":"리서치 종합 답변 본문의 인라인 URL도 짧은 하이퍼링크로 축약","재현 절차 / 완료 조건":"v0.8.3(출처 블록 축약) 후속. 모델 생성 본문(종합 답변 synth + finding 텍스트)의 URL을 _shorten_urls_in_text() 로 정규화: 마크다운 [label](\u003curl>)/[label](url), 꺾쇠 \u003curl>/\u003curl|label>, raw URL 3단계 치환 → Slack \u003curl|짧은라벨>. trailing 문장부호 절단, lookbehind 로 이중치환 방지, 멱등성 보장.","원인 및 수정 / 결과":"v0.8.3 배포 후 라이브 확인 시 구조화 출처 블록은 축약됐으나 모델이 [매체명](\u003curl>) 마크다운으로 박은 인라인 출처가 Slack 마크다운 링크 미지원으로 URL 원문 노출(특히 Gemini 그라운딩 redirect 200자+). 본문도 축약해 가독성 확보.","영향 범위":"리서치 모드 종합 답변/리포트 본문 표시(modes/research.py _format_report, ResearchMode.start)","발생 버전":"v0.8.3","수정 버전":"v0.8.4","상태":"완료","트래커":114,"비고":"Minor"},{"이슈번호":114,"발견일":"2026-06-11","유형":"enhancement","심각도":"minor","영역":"backend","제목":"리서치 하위 주제 수 6→4 축소로 응답시간 단축","재현 절차 / 완료 조건":"RESEARCH_SUBQ_MAX 기본값 6→4 (config.py 기본값 + .env + .env.example 동기화).","원인 및 수정 / 결과":"리서치 1건에 약 7분 소요. 질문당 AI 호출이 13회(분해1+조사6+검증6+종합1)→10회(조사4+검증4)로 줄어 체감 시간 단축. 커버리지와 속도의 균형점으로 4 선택.","영향 범위":"리서치 모드 전체 소요시간(config.RESEARCH_SUBQ_MAX)","발생 버전":"v0.8.4","수정 버전":"v0.8.5","상태":"완료","트래커":115,"비고":"Minor"},{"이슈번호":115,"발견일":"2026-06-11","유형":"enhancement","심각도":"minor","영역":"frontend","제목":"리서치 분담조사/교차검증 단계 진행 카운터 (n/N)","재현 절차 / 완료 조건":"분담 조사·교차검증 단계의 정적 \"...중\" 메시지를 (0/N) 으로 게시 후 각 병렬 작업 완료 시 chat_update 로 (n/N) 실시간 갱신. 신규 _post_get_ts()/_update() 헬퍼. ts None 시 graceful 무시.","원인 및 수정 / 결과":"리서치가 6~7분 걸리는데 진행 단계가 불투명해 \"멈춘 건가?\" 답답함(실사용 피드백). 진행률을 눈으로 확인 가능하게 해 멈춤 오인 방지.","영향 범위":"리서치 모드 진행 메시지(ResearchMode.start)","발생 버전":"v0.8.4","수정 버전":"v0.8.5","상태":"완료","트래커":116,"비고":"Minor"},{"이슈번호":116,"발견일":"2026-06-16","유형":"bug","심각도":"Major","영역":"backend","제목":"리서치 모드, 교차검증이 찾은 교정 사실 무시 + 긴 링크 분할로 출력 깨짐","사전 조건":"시점이 중요한 사실형 질문(이벤트/혜택 등)을 #ai-리서치에 투입","재현 절차 / 완료 조건":"1. #ai-리서치에 '중개형 ISA 이벤트 증권사 추천' 질문 2. 종합 답변이 '키움뿐'으로 단정(실제 한국투자증권도 6월 진행 중) 3. 이어지는 리서치 리포트의 긴 Gemini 그라운딩 URL이 메시지 경계에서 두 동강나 깨짐","원인 및 수정 / 결과":"원인1: _findings_block이 검증자 NOTE(교정 사실)를 종합 프롬프트에 안 넘겨 유실 → NOTE 포함. 원인2: _post_long/_broadcast_long 맹목 분할이 \u003curl|label> 링크를 절단 → 신규 _split_for_slack 로 줄/링크 경계 보존(초과 링크는 통째로). 원인3: 이중꺾쇠(\u003c\u003c>>) 잔재 → 연속 꺾쇠 축약. + 종합 프롬프트에 dispute 결론 교정/철회 규칙 추가.","영향 범위":"리서치 모드(ResearchMode) 종합 답변/리포트 정확도·렌더링","발생 버전":"v0.8.5","수정 버전":"v0.8.6","상태":"완료","트래커":117,"비고":"Major"},{"이슈번호":117,"발견일":"2026-06-16","유형":"enhancement","심각도":"major","영역":"backend","제목":"리서치 모드 1차 출처 정독 + 결론 정교화 재설계","재현 절차 / 완료 조건":"조사 단계 1차 출처(공식·공시·규제기관) 직접 fetch·정독 + 최신성(현재 진행중/과거 종료) 구분 의무화. 종합 단계 증거 게이트(1차 1개 포함 출처≥2일 때만 '확정')·진행중/종료/불확실 3구간 분리·비교형 순위표. 검증 단계 인용된 1차 출처 재fetch 로 시점·수치 대조. 종합 분량 1500→2500자.","원인 및 수정 / 결과":"리서치가 토론보다 느린데도 스니펫 의존·결론 미정교로 더 나쁜 결과를 내, '느린 대신 깊다'는 리서치 모드의 존재가치(근거 깊이+결론 정교화) 확보 필요.","영향 범위":"리서치 모드 조사/검증/종합 파이프라인","발생 버전":"v0.8.5","수정 버전":"v0.8.6","상태":"완료","트래커":118,"비고":"Major"},{"이슈번호":118,"발견일":"2026-06-16","유형":"bug","심각도":"Major","영역":"backend","제목":"리서치 분해가 부모 질문·제약을 하위질문에 누락 (제약 위반 답·조사불가)","사전 조건":"제약(예산·사양·수량·기간 등)이 있는 질문을 #ai-리서치에 투입","재현 절차 / 완료 조건":"1. '87키 풀알루미늄 키보드 15만원 이하 추천' 투입 2. 일부 서브에이전트가 75% 키보 스로 cwd 밖 파일 접근이 막힘(Gemini/Claude CLI 는 무영향). 수정: DebateMode._bind_thread(thread_ts, request_text) 로 변경해 주제(start)·후속질문+원주제(followup)의 화이트리스트(ALLOWED_WORK_DIRS) 경로를 추출(security.extract_work_path)·검증(validate_work_dir)해 전 에이전트 + 백업 풀의 _cwd 로 바인딩(미지정/비허용 시 None 초기화로 스레드 간 누수 방지). extract_work_path 를 coding 과 공유화 + 자연어 suffix 보강. Codex 2라운드 교차검증 통과, 회귀 123건 통과.","영향 범위":"토론 모드의 외부 경로 평가, Codex 에이전트 참여","발생 버전":"v0.8.7","수정 버전":"v0.8.8","상태":"완료","트래커":122,"비고":"Major"},{"이슈번호":122,"발견일":"2026-06-25","유형":"bug","심각도":"Major","영역":"backend","제목":"!bot restart 1회에 봇이 5중 spawn (재시작 재진입/중복)","사전 조건":"워치독 가동 중 Slack 명령 채널에서 !bot restart 전송","재현 절차 / 완료 조건":"1. Slack 워치독 채널에 !bot restart 1회 전송 2. 워치독이 봇을 5개(서로 다른 PID, 일부 6ms 간격 동시) spawn 하고 '재시작 완료'를 5번 방송 3. 중복 봇은 Slack 소켓 충돌로 곧 죽고 1개로 수렴(증상은 일시적)","원인 및 수정 / 결과":"원인: 워치독은 단일 인스턴스(.watchdog.lock)·단일 스레드인데도 start_bot() 의 재진입 가드(bot_process.poll() is None)가 비원자적(TOCTOU)이라 재시작이 짧게 겹치면 중복 spawn. 수정: restart_bot 에 재진입 가드(_restart_in_progress) + 디바운스(RESTART_DEBOUNCE=10s, monotonic)로 단일 명령=단일 재시작 보장. finally 에서 auto_restart/manual_stop/_restart_in_progress 를 항상 정상 복구(예외 시 플래그 누수로 크래시 자동재시작 건너뛰던 결함도 차단). 하드닝: 단일 인스턴스 lock 을 Windows named mutex(CreateMutexW, 원자적·종료 시 자동 해제)로 전환해 중복 워치독/stale/빈창/double-takeover race 원천 소거(생성 실패 시 fail-closed). 비-Windows 폴백도 takeover 없이 fail-closed. 신규/강화 테스트 17건, 전체 405 통과. Codex 교차검증 5라운드 전부 반영(Major 4 + Minor 4), 6라운드 확인은 컴패니언 작업 정지로 보류.","영향 범위":"워치독 봇 재시작/단일 인스턴스 보장, Slack 명령 안정성","발생 버전":"v0.8.8","수정 버전":"v0.8.9","상태":"완료","트래커":123,"비고":"Major"},{"이슈번호":123,"발견일":"2026-06-25","유형":"bug","심각도":"Minor","영역":"backend","제목":"mutex 전환 후 watchdog_guard 가 3분마다 헛 재기동(churn)","사전 조건":"v0.8.9 named mutex 전환(lockfile 미사용) + watchdog_guard 예약작업(3분 주기) 가동","재현 절차 / 완료 조건":"1. 새 워치독이 단일 인스턴스를 mutex 로만 보장하고 .watchdog.lock 을 쓰지 않음 2. watchdog_guard.is_watchdog_running()이 .watchdog.lock 의 PID 로 생존 판정 -> 'dead' 오판 3. 3분마다 워치독 재기동 시도 -> 매번 mutex ERROR_ALREADY_EXISTS 로 즉시 종료(churn/콘솔깜빡임)","원인 및 수정 / 결과":"원인: mutex 전환으로 lockfile 쓰기를 없앴는데 가드의 생존체크는 lockfile PID 기반이라 불일치. 수정: acquire_lock 의 Windows 경로에서 mutex 획득 성공 후 .watchdog.lock 에 PID 를 heartbeat 로 기록. 단일 인스턴스 보장은 여전히 mutex(원자적). lockfile 은 가드 정보용이라 race 무관. 가드가 live PID 를 보는 동안 lockfile 미변경 -> 1회 기록으로 churn 해소. 종료/크래시 시 stale -> 가드 정상 재기동. Codex 교차검증 핵심 4항목 통과(잔여 Minor 는 기존 가드 liveness 한계로 무관). test_watchdog 17건+전체 405 통과.","영향 범위":"워치독 가드 재기동 동작, 콘솔 깜빡임/리소스","발생 버전":"v0.8.9","수정 버전":"v0.8.10","상태":"완료","트래커":124,"비고":"Minor"},{"이슈번호":124,"발견일":"2026-07-03","유형":"bug","심각도":"Major","영역":"backend","제목":"Claude 세션 한도 초과 메시지가 백업 미투입 + '합의된 답변'으로 방송","사전 조건":"Claude Code CLI 5시간 세션 한도 초과 상태에서 토론 진행","재현 절차 / 완료 조건":"1. Claude 가 세션 한도 초과 상태(예: 5시간 한도 도달) 2. 슬랙 토론 채널에서 토론 시작 3. Claude 가 매 라운드 'You've hit your session limit · resets 7:50pm' 를 정상 stdout 으로 반환 4. 대체 투입 경고 없이 9라운드 내내 Claude 가 죽은 참가자(출력 0)로 남음 5. 최종 '💡 합의된 답변' 이 세션 한도 메시지 그 자체로 방송됨(질문에 대한 답이 '너 세션 한도 초과됨')","원인 및 수정 / 결과":"원인: agents/base.py _is_fatal_error 의 _FATAL_SUBSTRINGS/_FATAL_REGEX 가 세션/사용량 한도 문자열을 커버하지 않아 has_error=False -> needs_replacement=False -> 백업 대체 투입 미트리거. 또한 _generate_final_answer 가 교체 안 된 Claude 를 통합문 후보로 잡고 _is_bad_final_answer 도 이 메시지를 못 걸러서 방송. 수정: (1) _FATAL_SUBSTRINGS 에 'hit your session limit'/'reached your session limit'/'usage limit reached' full-phrase 추가(탐지 계층) -> 백업 자동 투입 + 교체된 Claude 최종답변 후보 제외. (2) _is_bad_final_answer 에 _is_fatal_error(answer) callable 가드 방어선 추가. 신규 테스트 11건(레드->그린), 기존 회귀 없음. Codex 교차검증 통과(발견 이슈 전부 Minor/Trivial, callable 가드만 반영, 나머지는 기존 설계 트레이드오프/별개 하드닝이라 제외). v0.7.7(API 500 방송) 동형 버그.","영향 범위":"토론/추가토론 모드, 최종 합의 답변, 백업 대체 투입","발생 버전":"v0.8.10","수정 버전":"v0.8.11","상태":"완료","트래커":125,"비고":"Major"},{"이슈번호":125,"발견일":"2026-07-03","유형":"bug","심각도":"Minor (테스트 전용, 제품 기능 영향 없음. 개발 머신에서 false 실패 → CI/개발 신뢰성 저하)","영역":"etc","제목":"TestBinarySelection 4건이 dev .env 의 GEMINI_CLI_BINARY=agy 누수로 실패 (테스트 격리)","사전 조건":"로컬 .env 에 GEMINI_CLI_BINARY=agy 설정(봇 agy 실가동) 상태","재현 절차 / 완료 조건":"1. .env 에 GEMINI_CLI_BINARY=agy 존재 2. pytest tests/test_gemini.py::TestBinarySelection 실행 3. default/empty/explicit-gemini/invalid 4건이 전부 agy 로 잡혀 실패 (agy 케이스만 우연히 .env 값과 일치해 통과)","원인 및 수정 / 결과":"원인: config.py 가 import 시 load_dotenv(override=True) 로 .env 를 읽는데, 이 테스트들이 GEMINI_CLI_BINARY 를 monkeypatch 한 뒤 importlib.reload(config) 를 하면 reload 가 load_dotenv(override=True) 를 재실행하며 dev .env 의 agy 가 monkeypatch 값을 덮어씀(테스트 격리 결함). 수정: TestBinarySelection 의 _restore_gemini_default autouse fixture 에 monkeypatch.setattr('dotenv.load_dotenv', no-op) 추가 -> reload 가 .env 를 다시 읽지 않아 monkeypatch 값 유지. monkeypatch 가 fixture teardown 이후 undo 되므로 teardown reload 동안에도 패치 유효(기본값 gemini 정상 복원). production config.py 의 override=True 는 봇 정책상 의도라 미변경. TestBinarySelection 10건 통과(4실패->0), 전체 421건 통과. Codex 교차검증 통과(발견 이슈 전부 Minor/Trivial).","영향 범위":"테스트 스위트(test_gemini.py), CI/로컬 개발 신뢰성","발생 버전":"v0.8.11","수정 버전":"v0.8.12","상태":"완료","트래커":126,"비고":"Minor"},{"이슈번호":126,"발견일":"2026-07-03","유형":"bug","심각도":"Major","영역":"etc","제목":"!bot restart 한 번에 봇이 세션 수만큼(4중) 중복 spawn (크로스세션 워치독 중복)","사전 조건":"예약작업 2개(SlackBotWatchdog=Interactive, SlackBotWatchdogGuard=S4U 세션0)로 서로 다른 세션에 워치독이 각각 기동된 상태","재현 절차 / 완료 조건":"1. 로그온 세션이 다른 워치독이 2개 이상 동시 가동(실측 5개: 세션0 4 + 대화형 1) 2. Slack 에서 !bot restart 1회 입력 3. 각 워치독이 명령을 독립 처리해 봇을 하나씩 spawn + '재시작 완료, Bot 시작됨(PID)' 메시지가 서로 다른 PID 로 4번 게시","원인 및 수정 / 결과":"원인: watchdog.py 단일 인스턴스 mutex 이름이 'Local\\slack_multi_agent_watchdog' 로 세션별(per-logon-session) 네임스페이스라 세션이 다른 워치독끼리 배제하지 못하고 무기한 공존(+ mutex 도입 전 6월 스테일 워치독 누적). 수정: acquire_lock 의 win32 경로에서 mutex 획득 전에 .watchdog.lock 의 PID 를 _is_pid_alive(OpenProcess, 세션 무관)로 확인해 살아있는 다른 워치독이 있으면 exit(0). Local mutex 는 동일 세션 원자성용으로 유지. Global mutex 는 S4U Limited 에서 SeCreateGlobalPrivilege 부재 시 생성 실패(fail-closed)로 워치독이 아예 안 뜰 위험이라 회피. 신규 테스트 3건 + 기존 mutex 테스트 2건 결정론화, watchdog 20건/전체 424건 통과. Codex 교차검증 PASS(로직/무회귀/Global회피 정당성). 잔여 동시 cold-start 레이스는 알려진 한계로 후속 LockFileEx 하드닝(별도 이슈) 추적. 이미 떠 있는 세션0 스테일 프로세스는 관리자 권한으로 별도 정리 필요.","영향 범위":"watchdog.py 단일 인스턴스, !bot restart, 봇 중복 응답/토큰 낭비","발생 버전":"v0.8.9","수정 버전":"v0.8.13","상태":"완료","트래커":127,"비고":"Major"},{"이슈번호":127,"발견일":"2026-07-03","유형":"enhancement","심각도":"minor","영역":"etc","제목":"워치독 크로스세션 단일 인스턴스 원자적 봉합 (LockFileEx)","재현 절차 / 완료 조건":"acquire_lock 의 크로스세션 배제를 lockfile alive-check(비원자적)에서 LockFileEx 커널 파일락(세션 무관, 특권 불필요, 프로세스 종료 시 OS 자동 해제)으로 보강해 동시 cold-start 레이스를 완전 봉합. PID 신원검증(생성시각/cmdline 대조)을 병행해 PID 재사용 오탐도 제거.","원인 및 수정 / 결과":"v0.8.13 의 lockfile alive-check 는 서로 다른 세션의 두 워치독이 stale lockfile 상태로 '동시에' cold-start 하면 둘 다 pre-check 를 통과하는 잔여 레이스가 있음(Codex Major). 정상상태는 단일 인스턴스로 수렴하나 원자적 보장은 아님.","영향 범위":"watchdog.py 단일 인스턴스","발생 버전":"v0.8.13","수정 버전":"v0.8.14","상태":"완료","트래커":128,"비고":"Minor"},{"이슈번호":128,"발견일":"2026-07-04","유형":"enhancement","심각도":"minor","영역":"backend","제목":"agy `-p` stdout 버그(#76) 재검증 + winpty 우회 방식 부적합 판정","재현 절차 / 완료 조건":"실호출 비교 테스트 3종을 봇과 동일 조건(stdin=DEVNULL, stdout=PIPE, AGY_CLI_DISABLE_AUTO_UPDATE=1)으로 수행: A) 순수 agy -p, B) winpty agy -p, C) 현재 디스크 transcript 복구(_recover_agy_response_retry 실코드).","원인 및 수정 / 결과":"agy 1.0.16(7/3 갱신)에서 upstream #76 이 해소되어 순수 agy -p 가 비-TTY 에서도 stdout 정상 출력(4회 100% 재현). winpty 방식은 winpty 자체가 stdin 이 tty 가 아니면 'stdin is not a tty' exit 1 로 실행 거부(DEVNULL/PIPE 동일, 우회 옵션 없음) -> 봇 headless subprocess 에서 부적합. 현재 디스크 복구는 stdout 결손 시에만 발동하는 무비용 안전망이라 agy 회귀 대비 존치. 결론: winpty 교체 안 함, 현행 유지, 코드 무변경.","영향 범위":"agents/gemini.py(agy 백엔드 경로), 봇 응답 수신","발생 버전":"v0.8.14","수정 버전":"v0.8.15","상태":"완료","트래커":129,"비고":"Minor"},{"이슈번호":129,"발견일":"2026-07-08","유형":"bug","심각도":"minor","영역":"backend","제목":"Codex exec 실행 로그(exited -1073741502 등)가 Slack 답변에 누출","사전 조건":"봇이 S4U 세션0(무데스크톱)에서 구동돼 Codex 셸/스킬 자식이 0xC0000142 로 크래시하는 상태(별도 이슈)","재현 절차 / 완료 조건":"1. 봇이 S4U 세션에서 가동 2. #ai-토론에 Codex 가 스킬/셸을 쓰게 되는 질문 입력(예: 'agy나 codex는 최상위 전역 메모리 기능이 없어?') 3. Codex 답변에 `Output:` 빈 블록, `exited -1073741502 in 31ms:`, `mcp: openaiDeveloperDocs/search_openai_docs (completed)` 조각이 그대로 노출됨","원인 및 수정 / 결과":"원인: _clean_codex_output 노이즈 필터가 `exited 0/1 in` 리터럴만 잡아 음수 exit code(-1073741502=0xC0000142 STATUS_DLL_INIT_FAILED)·`Output:` 단독·`mcp:` 라인을 못 걸렀음. 수정: `_CODEX_EXEC_LOG_LINE` 앵커드 정규식(음수·소수 duration, MCP started/completed/failed/error, Output:) 신설 후 정제 루프에 적용. 산문 오삭제 위험 있던 기존 `exited 0/1 in` 서브스트링 리터럴은 제거하고 정규식이 전담(^...$ 앵커라 '함수의 Output: 42'·'process exited 0 in my demo' 같은 본문은 보존). 회귀 테스트 7건 + 전체 432건 통과. Codex 교차검증 PASS(제안 3건 반영).","영향 범위":"토론/리서치 모드 Codex 답변 표시(Slack), agents/codex.py","발생 버전":"BE v0.8.15","수정 버전":"BE v0.8.16","상태":"완료","트래커":130,"비고":"Minor"},{"이슈번호":130,"발견일":"2026-07-08","유형":"bug","심각도":"major","영역":"backend","제목":"봇이 S4U 세션0(무데스크톱) 구동 시 Codex 셸/스킬 자식이 0xC0000142 로 전멸 → 무근거 답변","사전 조건":"watchdog_guard(S4U, 세션0)가 단일 인스턴스 락을 먼저 잡아 봇을 세션0에서 spawn 한 상태","재현 절차 / 완료 조건":"1. 봇이 S4U 가드 경로로 세션0에 기동 2. Codex 가 셸/스킬/웹 도구를 쓰려는 토론 질문 입력 3. Codex 의 모든 콘솔 자식 spawn 이 `exited -1073741502`(STATUS_DLL_INIT_FAILED)로 즉사, in-process MCP 만 성공 4. Codex 가 도구 없이 무근거로 답하며 'Claude 의견에 동의'로 얼버무림","원인 및 수정 / 결과":"원인: v0.8.1 에서 cmd 창 깜빡임 제거 목적으로 봇을 S4U 비대화형(세션0)으로 옮겼는데, 세션0 엔 데스크톱/윈도우스테이션이 없어 PowerShell·스킬 러너 등 콘솔 자식 프로세스가 DLL init 에 실패(0xC0000142). Interactive 세션에선 정상(활성 세션 A/B 실측: workspace-write·danger-full-access 둘 다 무크래시). 어느 워치독이 단일 락을 먼저 잡느냐로 세션이 갈림(watchdog_guard.start_watchdog 가 이기면 봇 트리가 세션0). 수정: 아키텍처 결정 대기(봇을 항상 데스크톱 세션에서 구동 vs 깜빡임 감수). 표면 로그 누출은 v0.8.16 필터로 봉합. [해결 v0.8.17 / Option 1: S4U(무깜빡임) 유지 + 토론/리서치 Codex 에 avoid_shell 지시 주입해 로컬 셸 시도 억제. Codex 는 openaiDeveloperDocs MCP·지식으로 그라운딩. 코딩 모드 셸 세션0 미동작은 드문 용도라 수용(완전 복구는 Option 2=대화형 상주, 깜빡임 부활).]","영향 범위":"토론/리서치 모드 Codex 도구 사용(셸/스킬/웹), watchdog_guard.py·watchdog.py 세션, Codex 답변 품질","발생 버전":"BE v0.8.1","수정 버전":"BE v0.8.17","상태":"완료","트래커":131,"비고":"Major"},{"이슈번호":131,"발견일":"2026-07-08","유형":"bug","심각도":"minor","영역":"backend","제목":"재기동 후 Codex 가 원격 MCP 일시적 HTTP 503 로그를 답변에 누출 + fatal 오탐으로 백업 교체","사전 조건":"봇이 재기동된 직후, 원격 MCP openaiDeveloperDocs(url=developers.openai.com/mcp) 엔드포인트가 일시적으로 503 반환","재현 절차 / 완료 조건":"1. !bot restart 로 봇 재기동(세션0 유지) 2. 토론 질문 입력(예: 오늘 매수할만한 주식 추천) 3. Codex 답변 첫 줄에 `2026-...Z ERROR rmcp::transport::worker: worker quit with fatal: ... HTTP 503: upstream connect error ... when send initialized notification` 누출 4. 봇이 그 'HTTP 503' 을 Codex fatal 로 오탐 → 'Codex 오류 감지 → Gemini-B 대체 투입' 으로 교체(Codex 는 실제로 유효 추천을 냈음)","원인 및 수정 / 결과":"원인: (1) v0.8.16 필터는 exec-log/Output:/mcp: 형식만 잡아 Rust tracing 로그(rmcp transport 오류)를 못 걸러 누출. (2) 봇은 progress 경로에서 정제 전 raw 로 _is_fatal_error 판정 → 로그의 'HTTP 503' 이 _FATAL_REGEX 에 걸려 has_error=True → 유효 답변인데도 백업 교체. openaiDeveloperDocs 는 원격이라 세션 무관, 503 은 재기동 직후 일시적 blip(조사 시점 엔드포인트 HTTP 200 정상). 수정: `_CODEX_TRACING_LOG` 정규식(ISO8601 타임스탬프+LEVEL target: 형식)으로 tracing 로그 라인 필터 + CodexAgent.ask_with_progress 가 has_error 를 정제된 답변 기준으로 재판정(cleaned 비어있지 않고 timed_out 아닐 때만; 진짜 API fatal 은 필터가 안 지우므로 유지). 회귀 6건 + 전체 443건 통과. Codex 교차검증 반영(정규식 엄격화, 넓은 rmcp:: substring 제거).","영향 범위":"토론/리서치 모드 Codex 답변 표시 + 백업 교체 로직, agents/codex.py","발생 버전":"BE v0.8.17","수정 버전":"BE v0.8.18","상태":"완료","트래커":132,"비고":"Minor"},{"이슈번호":132,"발견일":"2026-07-13","유형":"bug","심각도":"major","영역":"backend","제목":"에이전트 실패 응답 원문(세션 한도/타임아웃)이 정상 답변 말풍선으로 게시됨","사전 조건":"Claude CLI 가 세션 한도에 걸린 상태(You've hit your session limit) 또는 응답 타임아웃","재현 절차 / 완료 조건":"1. 토론 채널에 질문 입력 2. 라운드 1에서 Claude 가 세션 한도 문구를 stdout 으로 반환 3. Slack 에 '🟠 [Claude] You've hit your session limit · resets 1:20am / 출력 0 | $0.000' 이 정상 답변처럼 게시됨 4. 그 다음에야 '⚠️ Claude 오류 감지 → Codex-B 대체 투입' 경고가 붙음. 코딩 모드도 동일('[Claude] 응답 대기 시간 초과 (574초)' 말풍선). 최근 대화 실측 6회","원인 및 수정 / 결과":"원인: modes/debate.py 의 _ask_and_post() 가 응답을 먼저 post 하고, 오류 판정 루프는 asyncio.gather() 완료 후 별도로 돌았다. agent.has_error 는 post 시점에 이미 True 인데 post 경로가 그 플래그를 조회하지 않는 구조. modes/coding.py 의 _ask_with_backup 은 아예 실패 응답을 명시적으로 post 했다. 수정: post 전에 needs_replacement 검사 → 실패 응답 비게시, history/round_consensuses 에서도 제외(다음 라운드 프롬프트 오염 방지), 백업 없으면 '대체 에이전트 없음' 고지","영향 범위":"토론 모드 전 라운드, 코딩 모드 전 Phase, Slack 답변 표시","발생 버전":"BE v0.8.18","수정 버전":"BE v0.8.19","상태":"완료","트래커":133,"비고":"Major"},{"이슈번호":133,"발견일":"2026-07-13","유형":"bug","심각도":"minor","영역":"backend","제목":"폴백 시 동일 사건에 경고 2개('대체 투입' + '이후 라운드부터 교체') 중복 게시","사전 조건":"에이전트 오류/타임아웃으로 백업 투입이 발생","재현 절차 / 완료 조건":"1. 토론 중 Claude 장애 발생 2. '⚠️ Claude 오류 감지 → Codex-B 대체 투입' 게시 3. 바로 이어서 '⚠️ Claude 오류 감지 → 이후 라운드부터 Codex-B 교체' 가 또 게시됨(항상 쌍)","원인 및 수정 / 결과":"원인: 폴백 루프가 경고 1을 post 하고 같은 iteration 끝에서 호출하는 _replace_agent() 가 경고 2를 또 post. 수정: _replace_agent 의 post 를 제거하고 '대체 투입 (이후 라운드도 X)' 한 줄로 병합","영향 범위":"토론/코딩 모드 Slack 메시지","발생 버전":"BE v0.8.18","수정 버전":"BE v0.8.19","상태":"완료","트래커":134,"비고":"Minor"},{"이슈번호":134,"발견일":"2026-07-13","유형":"bug","심각도":"major","영역":"backend","제목":"후속 질문마다 교체 상태가 초기화되어 세션 한도로 죽은 에이전트를 매번 재호출","사전 조건":"세션 한도 등으로 이미 백업 교체된 에이전트가 있는 토론 스레드에서 추가 질문","재현 절차 / 완료 조건":"1. 토론 중 Claude 세션 한도 → Codex-B 교체 2. 같은 스레드에 추가 질문 입력 3. 추가 토론 라운드 1에서 Claude 가 다시 호출되어 같은 세션 한도 에러가 또 노출되고 폴백 절차를 처음부터 반복 4. 실측: 콜드브루 스레드에서 22:39/22:50/22:56 3회, 컵라면 스레드 2회","원인 및 수정 / 결과":"원인: slack_bot.py:194,205 가 메시지마다 DebateMode 를 새로 생성해 인스턴스 속성인 self._replaced 가 스레드 안에서 유지되지 않음. 세션 한도는 몇 시간 지속되는데 매번 재시도. 수정: 모듈 전역 _THREAD_REPLACED[thread_ts] = {원본: 백업} 으로 기억하고 _bind_thread 에서 복원해 첫 라운드부터 백업으로 시작. 상한 200스레드(FIFO 폐기). 프로세스 재기동 시 초기화 = 원본 재시도","영향 범위":"토론 모드 후속 질문(followup), 응답 지연 + 에러 반복 노출","발생 버전":"BE v0.8.18","수정 버전":"BE v0.8.19","상태":"완료","트래커":135,"비고":"Major"},{"이슈번호":135,"발견일":"2026-07-13","유형":"bug","심각도":"Major","영역":"backend","제목":"합의 조기 종료 불가: 어휘 발산 판정이 상시 True 라 만장일치에도 교전 라운드 강제","사전 조건":"없음","재현 절차 / 완료 조건":"1. 토론 질문 입력 2. 라운드 2에서 3/3 전원 동의(agree=true)인데도 종료하지 않고 라운드 3 진행 3. bot_output.log 실측: 라운드 판정 639건 중 diverged=True 606건(94.8%), 3/3 만장일치 354건도 발산 판정. 축구/AI비교 스레드가 불필요하게 3라운드까지 감(라운드당 CLI 3회 호출 낭비)","원인 및 수정 / 결과":"원인: _summaries_diverge() 가 한국어를 어절 단위로 자르는 토크나이저로 Jaccard 를 재고 최소 페어값을 썼다. 실측 보정 결과 어휘 유사도로는 합의/불합의 구분이 불가능하다: 같은 결론을 다른 표현으로 쓴 진짜 합의가 bigram 0.027 인데 서로 배타적 결론(라멘/파스타/초밥)이 0.045 로 더 높았다(토크나이저·임계값 조정으로 해결 불가). 수정: 유사도는 '수렴 확인'에만 사용 → 수렴 시 라운드 1 즉시 종료 허용, 그 외에는 상호 검토 1회(라운드 2) 후 종료. 교전 라운드는 CONSENSUS.disagreements 에 구조적 쟁점이 기록된 경우에 인 및 수정 / 결과":"원인: 1차 실패만 막고 백업 응답은 needs_replacement 검사 없이 게시·history·consensus 에 추가했다. 코딩 Phase 3(modes/coding.py)는 세 에이전트 결과를 먼저 게시한 뒤 교체를 검사하는 구조였다. 수정: 백업 응답도 실패 시 원문 대신 '백업도 실패' 만 고지하고 그 슬롯 없이 진행. 코딩 모드의 모든 게시 지점(_ask_with_backup, 병렬 경로 2곳, Phase 3)에 동일 가드 적용. Codex 교차검증 [1][2]","영향 범위":"토론/코딩 모드 이중 장애 경로, Slack 답변 표시","발생 버전":"BE v0.8.18","수정 버전":"BE v0.8.19","상태":"완료","트래커":139,"비고":"Major"},{"이슈번호":139,"발견일":"2026-07-13","유형":"bug","심각도":"major","영역":"backend","제목":"백업 풀 소진 시 이미 투입된 백업 인스턴스를 중복 삽입(동일 객체 동시 호출 위험)","사전 조건":"세 에이전트가 모두 백업으로 교체된 상태에서 백업 중 하나가 또 실패","재현 절차 / 완료 조건":"1. Claude/Codex/Gemini 가 순차로 모두 장애 → 백업 3개가 모두 self.agents 에 투입 2. 투입된 백업이 또 실패 3. _get_backup() 이 후보 소진 시 풀 전체로 되돌아가 이미 agents 에 있는 인스턴스를 반환 → 같은 객체가 리스트에 2번 들어가고 한 인스턴스가 동시에 호출될 수 있음","원인 및 수정 / 결과":"원인: _get_backup() 의 `if not candidates: candidates = list(self._backup_pool)` 폴백이 중복을 허용했다(기존 코드부터 있던 잠재 결함). 수정: 소진 시 None 을 반환하고 호출부가 '대체 에이전트 없음 (이번 라운드 제외)' 을 고지하도록 변경. Codex 교차검증 [1]","영향 범위":"토론 모드 다중 장애 경로, 에이전트 리스트 무결성","발생 버전":"BE v0.8.18","수정 버전":"BE v0.8.19","상태":"완료","트래커":140,"비고":"Major"},{"이슈번호":140,"발견일":"2026-07-13","유형":"bug","심각도":"Major","영역":"backend","제목":"codex -o 최종 메시지 파일 경로를 인스턴스 필드에 저장해 동시 호출 간 충돌/누수","사전 조건":"같은 에이전트 인스턴스가 동시에 두 번 호출되는 경우(리서치 분담 조사에서 소주제 4개를 에이전트 3개에 배분하면 한 인스턴스에 2건이 동시 배정)","재현 절차 / 완료 조건":"1. 리서치 모드에서 소주제 4개가 3개 에이전트에 분배 2. Codex 인스턴스가 2건을 동시에 실행 3. 두 호출이 self._last_msg_path 를 서로 덮어써, 한 호출이 다른 호출의 출력 파일을 읽거나 삭제할 수 있음 4. 타임아웃/취소 경로에서는 .last.md 파일이 임시 폴더에 잔존","원인 및 수정 / 결과":"원인: v0.8.19 초안이 `-o` 경로를 인스턴스 필드(self._last_msg_path)로 관리했다. 수정: 경로를 호출별 prompt tmp 에서 파생(\u003ctmp>.last.md)하고, AgentBase 에 _finalize_output/_cleanup_artifact 훅을 추가해 정상/타임아웃/취소/예외 모든 경로의 finally 에서 삭제. 실제 CLI 로 잔존 파일 0건 확인. Codex 교차검증 [3]","영향 범위":"Codex 계열 에이전트 전 모드(특히 리서치 병렬 조사), 임시 파일","발생 버전":"BE v0.8.19(커밋 전)","수정 버전":"BE v0.8.19","상태":"완료","트래커":141,"비고":"Major"},{"이슈번호":141,"발견일":"2026-07-13","유형":"bug","심각도":"major","영역":"backend","제목":"스레드 교체 기록 eviction 이 현재 스레드의 앞선 기록을 삭제 + 무잠금 경합","사전 조건":"_THREAD_REPLACED 가 상한(200)에 도달한 상태에서 기존 스레드에 두 번째 교체가 발생","재현 절차 / 완료 조건":"1. 가장 오래된 스레드에 Claude→Codex-B 교체가 기록된 상태 2. 같은 스레드에서 Codex 도 교체 3. 상한 초과 폐기가 가장 오래된 키(=바로 그 스레드)를 먼저 지워 Claude 기록이 소실 4. 다음 후속 질문에서 죽은 Claude 가 다시 투입됨","원인 및 수정 / 결과":"원인: v0.8.19 초안이 삽입 전 무조건 오래된 키를 폐기했다. 또한 토론은 스레드마다 별도 OS 스레드/이벤트 루프에서 돌아 module-global dict 의 read-modify-write 가 경합 위험. 수정: 새 키를 넣을 때만 폐기하고, threading.Lock 으로 get/set/pop 직렬화. Codex 교차검증 [4]","영향 범위":"토론 모드 후속 질문의 에이전트 교체 유지","발생 버전":"BE v0.8.19(커밋 전)","수정 버전":"BE v0.8.19","상태":"완료","트래커":142,"비고":"Major"},{"이슈번호":142,"발견일":"2026-07-13","유형":"bug","심각도":"Major","영역":"backend","제목":"한 에이전트의 타임아웃이 병렬 실행 중인 형제 에이전트의 CLI 프로세스까지 kill","사전 조건":"토론/리서치에서 3개 에이전트가 같은 thread_ts 로 병렬 실행 중, 그중 하나가 타임아웃","재현 절차 / 완료 조건":"1. 리서치/토론 실행 2. 한 에이전트가 타임아웃 3. base._kill_registered_processes 가 cancel.active_processes[thread_ts] 전체를 kill 4. 답변 중이던 나머지 에이전트도 같이 죽어 '응답 시간 초과' 로 표시됨. 실측: 7/9 리서치 로그에 [Claude-B] 180초 초과와 [Codex-B] 180초 초과가 같은 런에서 동시 발생(조사 1건 유실)","원인 및 수정 / 결과":"원인: _kill_registered_processes 가 이름/주석과 달리 thread_ts 의 모든 프로세스를 돌며 kill. 에이전트들이 thread_ts 를 공유하고 gather 로 병렬 실행되므로 형제 동반 사망. 수정: contextvars 기반 호출 스코프(_call_scope/_register_proc) 도입, 타임아웃 정리는 그 호출이 띄운 프로세스만 kill. /cancel 의 스레드 전체 kill 은 유지. GH #145","영향 범위":"토론/리서치/코딩 전 모드의 병렬 에이전트 실행","발생 버전":"BE v0.8.19.1","수정 버전":"BE v0.8.20","상태":"완료","트래커":145,"비고":"Major"},{"이슈번호":143,"발견일":"2026-07-13","유형":"bug","심각도":"major","영역":"backend","제목":"같은 timeout 인자가 에이전트마다 다른 예산을 의미 (Codex 300초 vs Claude 660초)","사전 조건":"없음","재현 절차 / 완료 조건":"1. 코딩 모드 실행(CLI_TIMEOUT_CODING=300) 2. Codex 는 300초에 타임아웃, Claude 는 600초까지 살아있음 3. 한 실행 로그에 '(300초)' 와 '(574초)' 가 함께 찍힘 4. Codex 만 먼저 죽고 그 타임아웃이 형제 kill 유발","원인 및 수정 / 결과":"원인: base=t, Claude=t*2, Gemini=t*2(가드 t*2.5) 로 내부에서 배수를 곱해 같은 인자가 다른 예산을 뜻함. 수정: 숨은 배수 전부 제거(timeout=t = 그 호출의 예산 t초). 실효 예산 유지를 위해 상수 상향: CLI_TIMEOUT 180→360, CLI_TIMEOUT_CODING 300→600. GH #144","영향 범위":"전 모드 타임아웃 동작, config.py","발생 버전":"BE v0.8.19.1","수정 버전":"BE v0.8.20","상태":"완료","트래커":144,"비고":"Major"},{"이슈번호":144,"발견일":"2026-07-13","유형":"bug","심각도":"minor","영역":"backend","제목":"코딩 모드 백업 에이전트가 primary 보다 짧은 예산으로 호출됨","사전 조건":"코딩 모드에서 primary 가 타임아웃/오류로 백업이 투입되는 상황","재현 절차 / 완료 조건":"1. 코딩 모드에서 Claude 가 CLI_TIMEOUT_CODING(300초) 로 실패 2. _ask_with_backup 이 backup.ask(prompt) 를 timeout 없이 호출 → 기본 CLI_TIMEOUT(180초) 3. primary 가 300초로도 못 끝낸 일을 백업이 180초에 처리해야 함 → 이중 실패 확률 상승","원인 및 수정 / 결과":"원인: modes/coding.py 의 백업 호출에 timeout 인자 누락. 수정: timeout=CLI_TIMEOUT_CODING 명시. GH #148","영향 범위":"코딩 모드 백업 투입 경로","발생 버전":"BE v0.8.19.1","수정 버전":"BE v0.8.20","상태":"완료","트래커":148,"비고":"Major"},{"이슈번호":145,"발견일":"2026-07-13","유형":"bug","심각도":"major","영역":"backend","제목":"리서치가 같은 에이전트 인스턴스에 소주제 2건을 동시 배정해 상태 플래그가 섞임","사전 조건":"리서치 소주제가 에이전트 수보다 많을 때(RESEARCH_SUBQ_MAX=4, 에이전트 3개)","재현 절차 / 완료 조건":"1. 소주제 4개가 3개 에이전트에 라운드로빈 배정 2. 한 인스턴스가 2건을 gather 로 동시 실행 3. timed_out/has_error/last_usage 가 인스턴스 속성이라 서로 덮어씀 4. 멀쩡한 조사가 실패로 판정돼 버려질 수 있음","원인 및 수정 / 결과":"원인: 인스턴스 상태 플래그 + 동일 인스턴스 동시 호출. 수정: _run_assigned() 로 분리해 에이전트 간에는 병렬, 같은 에이전트 안에서는 순차 실행. 에이전트 간 병렬성은 유지. GH #149","영향 범위":"리서치 모드 분담 조사","발생 버전":"BE v0.8.19.1","수정 버전":"BE v0.8.20","상태":"완료","트래커":149,"비고":"Major"},{"이슈번호":146,"발견일":"2026-07-13","유형":"bug","심각도":"major","영역":"backend","제목":"Claude 스트리밍에 외부 가드가 없어 읽기 루프 밖 hang 이 영구 대기","사전 조건":"Claude CLI 가 stdin drain/proc.wait 등 읽기 루프 밖에서 멈추는 경우","재현 절차 / 완료 조건":"1. Claude CLI 호출 2. await proc.stdin.drain() 에서 자식이 stdin 을 안 읽어 블록 3. 내부 데드라인은 읽기 루프 안에서만 검사하므로 도달하지 못함 4. 영구 대기(과거 Gemini 33분 hang 과 동일 계열)","원인 및 수정 / 결과":"원인: 읽기 루프 밖 await 에 데드라인 부재. 수정: base.ask_with_progress 가 _stream_once 를 t*GUARD_FACTOR(1.25) 로 감싸고, 가드 발동 시 해당 호출의 프로세스만 정리. Gemini 가드도 t*2.5→t*1.25 로 통일. GH #146","영향 범위":"Claude 계열 에이전트 전 모드","발생 버전":"BE v0.8.19.1","수정 버전":"BE v0.8.20","상태":"완료","트래커":146,"비고":"Minor"},{"이슈번호":147,"발견일":"2026-07-13","유형":"bug","심각도":"Major","영역":"backend","제목":"타임아웃 메시지가 실제보다 최대 60초 적게 표기되고 한도도 초과","사전 조건":"Claude 스트리밍이 타임아웃되는 경우","재현 절차 / 완료 조건":"1. 코딩 모드에서 Claude 타임아웃 2. Slack 에 '[Claude] 응답 대기 시간 초과 (574초)' 표기 3. 실제 경과는 634초 4. 한도 검사도 루프 진입 시점에만 해서 실효 상한이 예산+60초","원인 및 수정 / 결과":"원인: 루프 진입 시점에 잰 elapsed 를 60초 readline 대기 후 그대로 보고. 수정: readline 대기를 min(60, 남은 예산) 으로 자르고 보고 직전 elapsed 재측정. start_time 을 spawn 전으로 이동해 spawn/drain 도 예산에 포함. GH #143","영향 범위":"Claude 타임아웃 메시지/실효 한도","발생 버전":"BE v0.8.19.1","수정 버전":"BE v0.8.20","상태":"완료","트래커":143,"비고":"Minor"},{"이슈번호":148,"발견일":"2026-07-14","유형":"bug","심각도":"minor","영역":"backend","제목":"agy 콘솔 창 깜빡임 (이슈 #112 wontfix 재조사 후 해결)","사전 조건":"GEMINI_CLI_BINARY=agy + 봇이 대화형 세션(로그인 상태)에서 가동","재현 절차 / 완료 조건":"1. 토론/리서치 채널에 질문 전송\n2. agy 호출 시 cmd 콘솔 창이 잠깐 떴다가 사라짐(깜빡임)\n(이슈 #112 는 '호출마다' 라고 기록했으나 실측 결과 15분에 한 번)","원인 및 수정 / 결과":"원인(실측 확정): agy 는 ~/.gemini/antigravity-cli/last_check.timestamp 기준 **15분 쿨다운**으로 업데이트를 체크한다(cli.log: 'auto_updater.go:207] Last check was less than 15 minutes ago, skipping update'). 쿨다운이 지나면 detached 손자 'agy --bg-updater' -> 'agy --version' 을 spawn 하고, 그 'agy --version' 이 소유한 PseudoConsoleWindow 가 대화형 데스크톱에 표시된다(Win32 GetWindowThreadProcessId 로 창 소유 프로세스 pid 까지 확인). agy 1.1.2 에서도 그대로이며 1.0.16->1.1.2 체인지로그에 관련 수정 없음.\n수정: agents/gemini.py 에 _suppress_agy_updater() 추가. agy 를 띄우기 직전에 타임스탬프를 **현재 시각**으로 갱신하면 agy 가 항상 쿨다운으로 판정해 업데이터를 아예 spawn 하지 않는다. 이슈 #112 는 타임스탬프 '미래화' 를 시도했다가 agy 가 리셋해 실패했는데, 미래 시각은 이상값이라 되돌려진 것으로 보인다(현재 시각은 정상값이라 쿨다운에 그대로 걸린다). _run_cli 와 _run_progress_once 양쪽에 적용(토론/코딩은 후자를 탄다 - Codex 교차검증 발견). temp+os.replace 로 원자적 쓰기(agy 가 빈 파일을 읽으면 오히려 업데이터가 뜬다), temp 이름에 uuid(교차 스레드 충돌 방지), best-effort(실패해도 봇을 죽이지 않음).\n검증: 단위 9건 + 전체 487 통과. E2E 실측 - 대조군 창 1개 vs 억제 3회 모두 창 0개.","영향 범위":"agy 사용 시 모든 에이전트 호출(토론/코딩/리서치), Windows 대화형 세션. 부작용: agy 자동 업데이트 영구 스킵(이미 AGY_CLI_DISABLE_AUTO_UPDATE 로 끄고 있어 의도와 부합, 업데이트는 수동 `agy update`)","발생 버전":"BE v0.8.20","수정 버전":"BE v0.8.22","상태":"완료","트래커":"SYM-12","비고":"Minor"},{"이슈번호":149,"발견일":"2026-07-13","유형":"bug","심각도":"Minor","영역":"backend","제목":"외부 가드 취소 시 살아있는 CLI 를 죽이기 전에 부산물을 지워 임시 폴더에 파일 누수","증상 / 현재 상태":"외부 가드가 취소할 때 CLI 프로세스가 아직 살아 있는데 부산물을 먼저 지워 임시 폴더에 파일이 남는다","사전 조건":"외부 가드가 발동해 `_stream_once` 코루틴이 cancel 되는 상태","발견 경로 / 왜 지금인가":"코드 리뷰","원인 및 수정 / 결과":"GitHub 이슈 원문에서 역으로 채운 행이다. 등록 당시 엑셀 기록이 빠졌다.","영향 범위":"CodexAgent 의 `-o` 최종 메시지 파일, 전 에이전트의 프롬프트 임시 파일","발생 버전":"BE v0.8.20","수정 버전":"BE v0.8.21 (커밋: 18fb6a8)","상태":"완료","트래커":147},{"이슈번호":150,"발견일":"2026-09-16","유형":"bug","심각도":"major","영역":"security","제목":"requirements 하한이 낮아 pypdf 가 조작된 PDF 에 DoS 되는 버전으로 설치된다","증상 / 현재 상태":"- requirements.txt 가 pypdf>=4.0, requests>=2.31.0 처럼 하한만 두어 취약 버전이 설치돼 있었다.\n- pypdf 6.9.2 에 조작된 PDF 로 장시간 실행이나 메모리 고갈을 유발하는 취약점 47건이 있다.\n- requests 2.32.5 는 extract_zipped_paths 의 임시파일 재사용(GHSA-gc5v-m9x4-r6x2) 등 2건.","기대 결과 / 바꾼 뒤 상태":"- Slack 으로 들어온 첨부를 파싱하는 의존성에 알려진 취약점이 없어야 한다.","실제 결과":"- OSV 조회 결과 pypdf 47건, requests 2건.","사전 조건":"- 봇이 Slack 첨부 PDF 를 pypdf 로 파싱하므로, 채널에 올린 파일이 그대로 파서 입력이 된다.","재현 절차 / 완료 조건":"1. requirements.txt 에서 pypdf 와 requests 가 하한만 지정된 것을 확인\n2. pip show 로 설치 버전 확인 (pypdf 6.9.2, requests 2.32.5)\n3. OSV API 에 각 패키지와 버전으로 조회","재현 빈도":"- 항상","증거":"- OSV API 응답. pypdf 취약점 다수가 6.10.x~6.16.x 구간에서 순차 수정됨.","발견 경로 / 왜 지금인가":"- 코드 리뷰. 전체 프로젝트 보안 점검 중 확인.","원인 및 수정 / 결과":"원인: - requirements.txt 를 하한(>=)으로만 관리해 취약 버전이 그대로 남았다.\n\n수정 내용: - requests>=2.34.2, pypdf>=6.18.1 로 하한을 올리고 사유를 주석으로 남겼다.\n- 설치 후 OSV 재조회 둘 다 0건\n- pytest 487건 통과","재발 방지 / 하지 않을 것":"- 하한 상향이 가드다. 다만 하한 방식은 시간이 지나면 다시 벌어지므로 주기 점검이 필요하다.","영향 범위":"- Slack 첨부 PDF 파싱 경로. 채널 참여자가 조작된 PDF 로 봇을 멈출 수 있었다.","발생 버전":"v0.8.22","수정 버전":"- v0.8.23","상태":"완료","트래커":"SYM-97"},{"이슈번호":151,"발견일":"2026-09-16","유형":"bug","심각도":"minor","영역":"security","제목":"공개 레포에 로컬 절대경로가 남아 Windows 사용자명과 홈 구조가 노출된다","증상 / 현재 상태":"- public 레포 sym804/ai-squad 의 추적 파일 9곳에 C:\\Users\\\u003cuser>\\... 가 남아 있다.\n- Windows 사용자명, 홈 디렉터리 구조, 보유 프로젝트명(stockradar, sym-ui), .gemini 확장 설치 내역이 드러난다.\n- 대상: RELEASE_NOTES.md, agents/codex.py 주석, docs/2026-04-02-implementation-plan.md, tests/test_security.py, tests/test_debate_cwd.py, tests/test_codex_last_message.py, tests/test_gemini.py, migrate_session0.ps1, start_watchdog.vbs, issue_log.xlsx.","기대 결과 / 바꾼 뒤 상태":"- 공개 레포 추적 파일에 개인 절대경로가 없어야 한다.","실제 결과":"- 단일 백슬래시 형태 15곳, 소스에 이스케이프된 이중 백슬래시 형태 4곳, xlsx 내부 1곳.","재현 절차 / 완료 조건":"1. git ls-files 로 추적 파일 목록을 뽑는다\n2. 각 파일에서 C:\\Users\\\u003cuser> 를 단일/이중 백슬래시 두 형태로 찾는다\n3. xlsx 는 zip 이므로 압축을 풀어 sheet xml 까지 본다","재현 빈도":"- 항상","증거":"- 추적 파일 74개 전수 스캔 결과. issue_log.xlsx 는 xl/worksheets/sheet1.xml 의 K122 셀.","발견 경로 / 왜 지금인가":"- 코드 리뷰. 전체 프로젝트 보안 점검 중 확인.","원인 및 수정 / 결과":"원인: - 로컬에서 쓰던 경로를 그대로 커밋했다. 같은 유형이 claude-config 에서 한 번 정리된 적 있는데 이 레포는 남아 있었다.\n\n수정 내용: - 문서와 테스트의 경로를 C:\\work\\... 또는 플레이스홀더로 치환했다.\n- migrate_session0.ps1 은 폴백을 Get-Location 으로, 실행 예시에 cd 전제를 명시했다.\n- start_watchdog.vbs 는 자기 위치 기준(WScript.ScriptFullName)으로 바꿨다. WSH 가 UTF-8 을 못 읽으므로 주석은 ASCII 로 유지했다.\n- issue_log.xlsx 는 OPENPYXL_LXML=False 로 저장하고 전 셀 2,537개를 대조해 무손실 확인했다.\n- pytest 487건 통과.","재발 방지 / 하지 않을 것":"- 붙이지 않았다. pre-commit 에 xlsx 언집을 포함한 개인정보 스캔 훅을 거는 것이 근본 처방이나 별도 작업이다.","영향 범위":"- git 히스토리에는 그대로 남으므로 이 수정의 효과는 앞으로의 노출 축소에 한정된다.","발생 버전":"v0.8.22","수정 버전":"- v0.8.23","상태":"완료","트래커":"SYM-98"}],"held":{"sheet":"조인_보류","fields":["엑셀행","엑셀 이슈번호","엑셀 제목","제안 트래커","트래커 제목","유사도","등급","판정(사람이 적음)"],"rows":[{"엑셀행":80,"엑셀 이슈번호":79,"엑셀 제목":"Slack 첨부 이미지 분석 지원 (Claude/Gemini Vision)","제안 트래커":79,"트래커 제목":"Slack 첨부 이미지 분석 (Claude/Gemini Vision SDK)","유사도":0.923,"등급":"강","판정(사람이 적음)":"확정 (유사도 0.92, 발견일차 0일)"},{"엑셀행":81,"엑셀 이슈번호":80,"엑셀 제목":"이미지 첨부 분석을 SDK 직호출로 잘못 구현 → CLI prompt 첨부로 정정","제안 트래커":80,"트래커 제목":"이미지 첨부 분석을 SDK 직호출에서 CLI prompt 첨부로 정정","유사도":0.889,"등급":"강","판정(사람이 적음)":"확정 (유사도 0.89, 발견일차 0일)"},{"엑셀행":82,"엑셀 이슈번호":81,"엑셀 제목":"텍스트+이미지 한 번에 입력 시 봇 무반응","제안 트래커":81,"트래커 제목":"텍스트+이미지 동시 입력 시 봇 무반응 (file_share subtype 차단 회귀)","유사도":0.51,"등급":"약","판정(사람이 적음)":"확정 (눈으로 대조: 텍스트+이미지 동시 입력 시 봇 무반응. 한 번에/동시 표현 차이)"},{"엑셀행":86,"엑셀 이슈번호":85,"엑셀 제목":"Gemini 차트 이미지 종목 오인 방지 가드","제안 트래커":85,"트래커 제목":"Gemini 차트 이미지 종목 오인 방지 가드 prompt 추가","유사도"
